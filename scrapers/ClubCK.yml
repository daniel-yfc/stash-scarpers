# CLUB CK / COAT (coat.co.jp) — public CDP version.
# Verification status: UNVERIFIED against live Stash.
# SAMPLE1 (product_id=3264) confirmed:
#   - login-gated rendered DOM
#   - h1 is hidden "20DVD" (do not use)
#   - last #topicpath a[normalize-space()] = SPARK
#   - eccube.classCategories product_code = COCODV563
#   - #jacket exists; #eyecatch is pickup, not cover
# CK href, 発売日，details, tags, search cards: not fully
# readable from the 132KB snapshot via crawler. Marked UNVERIFIED.
#
# Public CDP version: driver.useCDP: true; no driver.cookies.
#
# Field rules (source language, not translated):
#   Title   h2.margin-none as-is (keep ADULT / Jump!; 3264 has no SPARK)
#   Studio  last non-empty #topicpath link (レーベル)
#   Code    eccube.classCategories product_code (COCODV563, not COCO563-HD)
#   Date    発売日，not CK "2026.08.06 UP"
#   Image   #jacket /upload/save_image/{CODE}.jpg (strip EC-CUBE *h.jpg)
#   URLs    canonical detail + first ck-download.com/product/detail/{id}
#           (ignore footer homepage ck-download.com)
#   Details intro blurb only; cut numbered 1.〈 scene list
#   Tags    category chips; keep イケメン/アイドル as one tag
# Search does not paginate. Stash only sees the first result page.
# Last Updated: 2026-08-28

name: ClubCK COAT

sceneByURL:
  - action: scrapeXPath
    url:
      - coat.co.jp/products/detail.php
      - www.coat.co.jp/products/detail.php
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.coat.co.jp/products/list.php?mode=search&name={}"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: "https://www.coat.co.jp/products/list.php?mode=search&name={title}"
  queryURLReplace:
    title:
      - regex: '\.[^.]+$'
        with: ""
      - regex: '[_\.]+'
        with: " "
      - regex: '\s{2,}'
        with: " "
      - regex: '^\s+|\s+$'
        with: ""
  scraper: searchScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//div[@id='product-list-wrap']//div[contains(@class,'list_area')][.//a[contains(@href,'/products/detail.php')]]"

    scene:
      Title:
        selector: "$results//a[contains(@href,'/products/detail.php')]//img/@alt | $results//h3"
        postProcess:
          - replace:
              - regex: "\\s{2,}"
                with: " "
              - regex: "^\\s+|\\s+$"
                with: ""

      URLs:
        selector: "$results//a[contains(@href,'/products/detail.php')][1]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://www.coat.co.jp" + v;
              return "https://www.coat.co.jp/" + v;

      Image:
        selector: "$results//img[contains(@src,'upload/save_image/')]/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (v.indexOf("upload/save_image/") !== -1) {
                v = v.replace(/h\.(jpe?g|png|webp)$/i, ".$1");
              }
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.coat.co.jp" + v;
              return "https://www.coat.co.jp/" + v;

  sceneScraper:
    common:
      $jacket: "//div[@id='jacket']"
      $meta: "//div[contains(@class,'status2')]"
      $desc: "//div[@id='products_description']"

    scene:
      Title:
        selector: "//h2[contains(@class,'margin-none')][normalize-space()] | $jacket//img/@alt | //title"
        postProcess:
          - replace:
              - regex: "\\s{2,}"
                with: " "
              - regex: "^\\s+|\\s+$"
                with: ""

      Code:
        selector: "//script[contains(.,'eccube.classCategories')]"
        postProcess:
          - javascript: |
              var v = value || "";
              var m = v.match(/"product_code"\s*:\s*"([A-Z0-9]+)"/);
              return m ? m[1] : "";

      URLs:
        selector: "//link[@rel='canonical']/@href | //meta[@property='og:url']/@content | //a[contains(@href,'ck-download.com/product/detail/')]/@href"
        concat: "\n"
        postProcess:
          - javascript: |
              var seen = {};
              var out = [];
              function add(u) {
                u = (u || "").replace(/^\s+|\s+$/g, "");
                if (!u) return;
                u = u.replace(/^\/\//, "https://");
                u = u.replace(/^http:\/\//i, "https://");
                if (u.indexOf("http") !== 0) {
                  if (u.charAt(0) !== "/") return;
                  if (u.indexOf("ck-download") !== -1) u = "https://www.ck-download.com" + u;
                  else u = "https://www.coat.co.jp" + u;
                }
                if (seen[u]) return;
                seen[u] = true;
                out.push(u);
              }
              var ck = false;
              (value || "").split(/\n/).forEach(function (u) {
                if (/ck-download\.com\/product\/detail\/\d+/.test(u || "")) {
                  if (ck) return;
                  add(u);
                  ck = true;
                  return;
                }
                add(u);
              });
              return out.join("\n");
        split: "\n"

      Date:
        selector: "$meta//li[contains(.,'発売')] | $meta//li[contains(.,'年') and contains(.,'月')]"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              var m = v.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
              if (!m) m = v.match(/(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})/);
              if (!m) return "";
              var mm = ("0" + m[2]).slice(-2);
              var dd = ("0" + m[3]).slice(-2);
              return m[1] + "-" + mm + "-" + dd;
          - parseDate: "2006-01-02"

      Details:
        selector: "$desc//text()[normalize-space()]"
        concat: "\n"
        postProcess:
          - javascript: |
              var v = value || "";
              v = v.replace(/\r\n/g, "\n");
              v = v.replace(/[ \t]+\n/g, "\n");
              v = v.replace(/^\s*商品説明\s*/g, "");
              v = v.replace(/\n\s*\d+[..？]?\s*[〈【][\s\S]*$/, "");
              v = v.replace(/\n?\s*販売價格[\s\S]*$/, "");
              v = v.replace(/\n{3,}/g, "\n\n");
              return v.replace(/^\s+|\s+$/g, "");

      Image:
        selector: "$jacket//a[contains(@href,'upload/save_image/')]/@href | $jacket//img[contains(@src,'upload/save_image/')]/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (v.indexOf("upload/save_image/") !== -1) {
                v = v.replace(/h\.(jpe?g|png|webp)$/i, ".$1");
              }
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.coat.co.jp" + v;
              return "https://www.coat.co.jp/" + v;

      Studio:
        Name:
          selector: "//ul[@id='topicpath']//a[normalize-space()][last()]"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

      Tags:
        Name:
          selector: "//ul[contains(@class,'relative_cat2')]//a[normalize-space()] | //div[contains(@class,'relative_cat')]//a[normalize-space()]"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
