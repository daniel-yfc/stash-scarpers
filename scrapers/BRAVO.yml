# BRAVO-JAPAN (bravo-japan.com) — Wix dynamic-pages site (配信作品紹介).
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Verification status (2026-09-06, anonymous fetch of live pages):
#   VERIFIED against https://www.bravo-japan.com/clips/275 (SSR source):
#   - Wix renders clip data via wix-warmup-data ssrPropsUpdates; after CDP
#     hydration the following comps carry content (stable per template):
#       #comp-kbfkf16x  h1.font_0   work title (シンタ兄貴とS熊兄貴)
#       #comp-kbfkf17h  p.font_8    description
#       #comp-kbfljjti  h2          CLIP No. (275)
#       #comp-kbfmf948  h2          time in minutes (37) + separate min label
#     og:title is just the CLIP No.; og:image is empty for this template.
#   - collection schema (配信作品紹介) has: title, clipNo, description, tag,
#     time, price, pv, store links — NO release date field.
#   - tags: meta[name=keywords] (comma-separated, source language).
#   - list pages: /clips (最新), /copy-N-of-clips (category/role variants);
#     detail URLs are /clips/{clipNo}. No keyword search endpoint exists
#     (Wix) — sceneByName intentionally omitted.
# Selector risk: Wix comp- IDs are template-stable but a site redesign
# breaks them; re-verify comp ids against a fresh page before trusting.
# Date/Studio: no verifiable per-clip date; studio brand omitted rather than
# invented (site covers BRAVO/GMPD/etc. lines).
# Last Updated: 2026-09-06

name: Bravo-Japan

sceneByURL:
  - action: scrapeXPath
    url:
      - "bravo-japan.com/clips/"
      - "www.bravo-japan.com/clips/"
    scraper: sceneScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: "https://www.bravo-japan.com/clips/{title}"
  queryURLReplace:
    title:
      - regex: '\.[^.]+$'
        with: ""
      - regex: "[^0-9]+([0-9]+)$"
        with: "$1"
      - regex: '^\s+|\s+$'
        with: ""
  scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $title: "//div[@id='comp-kbfkf16x']"
      $desc: "//div[@id='comp-kbfkf17h']"

    scene:
      Title:
        selector: "$title//h1[contains(@class,'font_0')] | //meta[@property='og:title']/@content"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""

      Code:
        selector: "//div[@id='comp-kbfljjti']//h2"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""

      URLs:
        selector: "//link[@rel='canonical']/@href"

      Duration:
        selector: "//div[@id='comp-kbfmf948']//h2"
        postProcess:
          - javascript: |
              var v = value || "";
              var m = v.match(/(\d+)/);
              if (!m) return "";
              return String(parseInt(m[1], 10) * 60);

      Tags:
        Name:
          selector: "//meta[@name='keywords']/@content"
          postProcess:
            - replace:
                - regex: ",\\s*"
                  with: ","
          split: ","

      Details:
        selector: "$desc//p[1]"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""

      Image: # UNVERIFIED — og:image empty; poster rendered by the CDP video player
        selector: "//div[@id='comp-kbflq5xd']//img/@src | //div[@id='comp-kbflq5xd']//video/@poster"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              return "";

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
