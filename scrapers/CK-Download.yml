# CK-Download
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Search verified 2026-08-27 from rendered /product/result?kw=雄穴
# (ul.title_list cards: /product/detail/34124, 34114, 27341).
# Detail sceneScraper UNVERIFIED on guest pages — product table is login-gated.
# 2026-10-06: Image gained div.set_photo branch (set pages) against live DOM.
# Last Updated: 2026-10-06

name: CK-Download

sceneByURL:
  - action: scrapeXPath
    url:
      - ck-download.com/product/detail/
      - www.ck-download.com/product/detail/
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.ck-download.com/product/result?kw_opt=1&kw={}&st_opt=1&p_opt=1&mt_opt=1"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: "https://www.ck-download.com/product/result?kw_opt=1&kw={title}&st_opt=1&p_opt=1&mt_opt=1"
  queryURLReplace:
    title:
      - regex: '\.[^.]+$'
        with: ""
      - regex: '[_\.]+'
        with: " "
      - regex: '\s{2,}'
        with: " "
      - regex: '^\s+|\s+$'
        with: ""
  scraper: searchScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//ul[contains(@class,'title_list')]//li[.//a[contains(@href,'/product/detail/')]]"
    scene:
      Title:
        selector: "$results//h4[1]"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""
      URLs:
        selector: "$results//a[contains(@href,'/product/detail/')]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://www.ck-download.com" + v;
              return "https://www.ck-download.com/" + v;
      Image:
        selector: "$results//div[contains(@class,'photo')]//img[1]/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://www.ck-download.com" + v;
              return "https://www.ck-download.com/" + v;
      Date:
        selector: "$results//div[contains(@class,'date')]"
        postProcess:
          - replace:
              - regex: "(\\d{4})[./-](\\d{1,2})[./-](\\d{1,2})"
                with: "$1-$2-$3"
          - parseDate: "2006-01-02"

  sceneScraper:
    common:
      $data: "//table[contains(@class,'prod_data')][1]"
      $cats: "//div[contains(@class,'prod_category')][1]"
    scene:
      Title:
        # th text is 'DVDタイトル' (no space); DVDタイトル td may be empty for
        # streaming-only items — fall back to the h3 product title (h1 is the
        # site slogan, not the product). Verified 2026-10-08 via walkthrough.
        selector: "$data//th[normalize-space(.)='DVDタイトル']/following-sibling::td[1][normalize-space()] | //div[@id='Contents']/h3[normalize-space()]/text() | //title"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""
      Code:
        selector: "$data//th[normalize-space(.)='プロダクトナンバー']/following-sibling::td[1]"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""
      Date:
        selector: "//div[contains(@class,'add_info')]//div[contains(@class,'date')][1]"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              var cleaned = v.replace(/\s*UP.*$/iu, "").trim();
              var m = cleaned.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/u);
              if (m) {
                var mm = ("0" + m[2]).slice(-2);
                var dd = ("0" + m[3]).slice(-2);
                return m[1] + "-" + mm + "-" + dd;
              }
              return cleaned;
          - parseDate: "2006-01-02"
      Studio:
        Name:
          selector: "$data//th[normalize-space(.)='レーベル']/following-sibling::td[1]//a[1] | $data//th[normalize-space(.)='メーカー']/following-sibling::td[1]//a[1]"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""
      Tags:
        Name:
          selector: "$cats//li[strong[normalize-space(.)='プレイ内容']]//a | $cats//li[strong[normalize-space(.)='モデルタイプ']]//a"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""
      Details:
        selector: "//div[contains(@class,'intro_text')]//p[string-length(normalize-space(.)) > 10 and not(contains(@style,'color'))]//text()[normalize-space()]"
        concat: "\n\n"
      Image:
        # Live DOM (2026-10-06): set pages render covers in div.set_photo
        # instead of the flexslider; og:image does not exist.
        # FlexSlider injects li.clone nodes (copies of the last slide) — exclude
        # them and take the global first match. Verified 2026-10-08.
        selector: "(//div[contains(@class,'photo_flexslider')]//ul[contains(@class,'slides')]/li[not(contains(@class,'clone'))]//img[not(contains(@src,'no_image'))])[1]/@src | //div[contains(@class,'set_photo')]//img[not(contains(@src,'no_image'))][1]/@src | //meta[@property='og:image']/@content"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://www.ck-download.com" + v;
              return "https://www.ck-download.com/" + v;

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0
  # 登入用 cookie 範本：未登入僅能看到 no_image 佔位圖。取消註解並填入
  # 你自己的值，切勿提交真實值到公開 repo。移除每行開頭的 "# " 即可啟用。
