# Games-Video / GAMES (games-video.co.jp) — plain server-rendered HTML shop.
# IMPORTANT: the site moved from games-video.com (parked domain, no longer
# serving content) to games-video.co.jp — the official ゲームスビデオ site.
# All URLs below target the live .co.jp domain.
#
# Verification status (2026-09-06, anonymous fetch of live pages):
#   VERIFIED against https://www.games-video.co.jp/dvd_detail.php?code=WIG-387
#   and https://www.games-video.co.jp/search.php?s=HUNK:
#   - detail is static HTML (Dreamweaver template, comments hold an old copy
#     of the info block — parsers treat it as a comment node, not elements):
#       div.left_etc > div.titlebar > h2       work title (雄穴中出し28)
#       table#property rows:
#         収録時間：165分                      duration in minutes
#         レーベル：WILD GAMES                 label → Studio
#         カテゴリー：search.php?c=NN links    categories → Tags
#         …発売日：2026年9月04日発売           release date
#       hidden input name=code (cart form)    product code (WIG-387)
#       a[rel=lightbox] href ./product/l/…    large cover (./product/sm/ is 240px)
#       p after h3 g_h3 ■作品詳細             description paragraph
#   - search: GET https://www.games-video.co.jp/search.php?s={query};
#     result cards are ul.product_list > li > table.product_list_b with the
#     detail link (dvd_detail.php?code=CODE), title link (tr 2), pickup
#     image (./product/pickup/CODE.jpg) and hidden input[name=code].
#   - dvd index: /dvd_index.php; category/label listings reuse the same
#     search.php endpoint (c=, pickup= params).
# No age gate; plain HTML 200 without cookies — CDP not required.
#
# Field rules (source language, not translated):
#   Title    titlebar h2 as-is
#   Code     cart hidden input @value (uppercase product code)
#   Date     発売日 text "2026年9月04日発売" → normalized to YYYY-MM-DD
#   Image    a[rel=lightbox] @href (large ./product/l/ cover)
#   Tags     property table カテゴリー links (labels as shown)
#   Studio   レーベル text (WILD GAMES, HUNK, …)
#   Performers: detail pages have no performer list (model.php is nav only)
#   — omitted intentionally.
# Last Updated: 2026-09-06

name: Games-Video

sceneByURL:
  - action: scrapeXPath
    url:
      - "games-video.co.jp/dvd_detail.php"
      - "www.games-video.co.jp/dvd_detail.php"
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.games-video.co.jp/search.php?s={}"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: "https://www.games-video.co.jp/search.php?s={title}"
  queryURLReplace:
    title:
      - regex: '\.[^.]+$'
        with: ""
      - regex: '[_\.]+'
        with: " "
      - regex: '\s{2,}'
        with: " "
      - regex: '^\s+|\s+$'
        with: ""
  scraper: searchScraper

xPathScrapers:
  searchScraper:
    common:
      $card: "//table[contains(concat(' ',normalize-space(@class),' '),' product_list_b ')]"

    scene:
      Title:
        selector: "$card//tr[2]//a[1]/text()"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""

      Code:
        selector: "$card//input[@name='code']/@value"

      URLs:
        selector: "$card//tr[2]//a[1]/@href"

      Image:
        selector: "$card//tr[1]//img/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              v = v.replace(/^\.\/+/, "");
              if (v.charAt(0) === "/") return "https://www.games-video.co.jp" + v;
              return "https://www.games-video.co.jp/" + v;

  sceneScraper:
    common:
      $prop: "//table[@id='property']"

    scene:
      Title:
        selector: "//div[contains(@class,'left_etc')]//div[contains(@class,'titlebar')]//h2/text()"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""

      Code:
        selector: "//div[@id='main_contents']//form//input[@name='code']/@value"

      URLs:
        selector: "//link[@rel='canonical']/@href"

      Date:
        selector: "$prop//td[contains(text(),'発売日')]/text()"
        postProcess:
          - javascript: |
              var v = value || "";
              var m = v.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
              if (!m) return "";
              var mm = ("0" + m[2]).slice(-2);
              var dd = ("0" + m[3]).slice(-2);
              return m[1] + "-" + mm + "-" + dd;
          - parseDate: "2006-01-02"

      Duration:
        selector: "$prop//td[contains(text(),'収録時間')]/text()"
        postProcess:
          - javascript: |
              var v = value || "";
              var m = v.match(/(\d+)/);
              if (!m) return "";
              return String(parseInt(m[1], 10) * 60);

      Studio:
        Name:
          selector: "$prop//td[contains(text(),'レーベル')]/text()"
          postProcess:
            - replace:
                - regex: "^.*?レーベル："
                  with: ""
                - regex: "^\\s+|\\s+$"
                  with: ""

      Details:
        selector: "//p[preceding-sibling::h3[contains(text(),'作品詳細')]]//text()[normalize-space()]"
        concat: "\n"
        postProcess:
          - javascript: |
              var v = value || "";
              v = v.replace(/\r\n/g, "\n");
              v = v.replace(/[ \t]+\n/g, "\n");
              v = v.replace(/\n{3,}/g, "\n\n");
              return v.replace(/^\s+|\s+$/g, "");

      Image:
        selector: "//a[@rel='lightbox']/@href | //a[@rel='lightbox']//img/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              v = v.replace(/^\.\/+/, "/");
              if (v.charAt(0) === "/") return "https://www.games-video.co.jp" + v;
              return "https://www.games-video.co.jp/" + v;

      Tags:
        Name:
          selector: "$prop//td[contains(text(),'カテゴリー')]//a[contains(@href,'search.php?c=')]/text()"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

driver:
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
