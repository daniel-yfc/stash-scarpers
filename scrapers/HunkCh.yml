# Hunk's Channel
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Search verified 2026-08-27: /search.php?s=雄穴&fromSearch=on
# cards in #newmovie tables (GV-OND28001, TR-CS007, KPP-1122).
# Detail: guest HTML has ブランド/発売日/ストーリー; cover/title h2 need login+CDP.
# common keys are parenthesized unions: Stash substitutes $var by string
# replacement, so a bare `A | B` used as `$var//x` would parse as
# `A | B//x` and match the container itself. Always keep the parens.
# 2026-10-06: re-verified healthy on 3 detail pages; search probes
# (陸翔 / CR-0945_DL / 夏ハメ2026) all HIT.
# Last Updated: 2026-10-06
# Validator fix: Code no longer combines `fixed` with `postProcess` (schema
# fixed-value nodeSelector allows only 'fixed'). Uses canonical/og:url selector,
# same pattern as the existing Aliases field.

name: Hunk's Channel

groupByURL:
  - action: scrapeXPath
    url:
      - eng.hunk-ch.com/movie_detail.php
      - hunk-ch.com/movie_detail.php
      - www.hunk-ch.com/movie_detail.php
    scraper: groupScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - eng.hunk-ch.com/movie_detail.php
      - hunk-ch.com/movie_detail.php
      - www.hunk-ch.com/movie_detail.php
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.hunk-ch.com/search.php?s={}&fromSearch=on"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: "https://www.hunk-ch.com/search.php?s={title}&fromSearch=on"
  queryURLReplace:
    title:
      - regex: '\.[^.]+$'
        with: ""
      - regex: '[_\.]+'
        with: " "
      - regex: '\s{2,}'
        with: " "
      - regex: '^\s+|\s+$'
        with: ""
  scraper: searchScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//div[@id='newmovie']//div[contains(@class,'movie')]"
    scene:
      Title:
        selector: "$results//h4[1]//a[1]"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""
      URLs:
        selector: "$results//a[contains(@href,'movie_detail.php') and contains(@class,'button_movie_detail')]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://www.hunk-ch.com" + v;
              return "https://www.hunk-ch.com/" + v;
      Image:
        selector: "$results//img[contains(@name,'newvideo-1')]/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.hunk-ch.com" + v;
              return "https://www.hunk-ch.com/" + v;
      Date:
        selector: "$results//td[contains(.,'発売日')]"
        postProcess:
          - replace:
              - regex: ".*?発売日：\\s*(\\d{4}-\\d{2}-\\d{2}).*"
                with: "$1"
          - parseDate: "2006-01-02"

  groupScraper:
    common:
      $product: "(//div[contains(concat(' ',normalize-space(@class),' '),' product_detail_centre ')] | //table[@id='product'])"
      $data: "(//div[contains(concat(' ',normalize-space(@class),' '),' data ')] | //p[contains(.,'発売日') and contains(.,'ブランド')])"
    group:
      Name:
        selector: "$product//h2[1]"
        postProcess:
          - replace:
              # Trim series prefix like 【JUSTICE：Full HD】 first (2026-10-07).
              - regex: '^\s*【[^】]+】\s*'
                with: ""
              # Strip "パッケージ販売：" prefix on PKG pages (2026-10-07).
              - regex: "^\\s*パッケージ販売：\\s*"
                with: ""
              - regex: "^\\s+|\\s+$"
                with: ""
      Aliases:
        selector: "//link[@rel='canonical']/@href | //meta[@property='og:url']/@content"
        postProcess:
          - replace:
              - regex: "^.*?[?&]code=([^&]+).*$"
                with: "$1"
      Duration:
        # (?s): $data spans multiple lines; without it ^.*?$ cannot reach
        # the 収録時間 line. Verified 2026-10-08 via walkthrough.
        selector: "$data"
        postProcess:
          - replace:
              - regex: "(?s)^.*?(?:収録時間|時間)\\s*：\\s*(\\d+).*$"
                with: "$1"
      Date:
        selector: "$data"
        postProcess:
          - replace:
              - regex: ".*?発売日：\\s*(\\d{4}-\\d{2}-\\d{2}).*"
                with: "$1"
          - parseDate: "2006-01-02"
      URLs:
        fixed: "{inputURL}"
      Synopsis:
        selector: "//img[@title='ストーリー']/following::p[1]"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""
              # Trim blindfold disclaimer (2026-10-07).
              - regex: "\\s*本編メインモデルに目隠しはございません。(ウケモデルの射精シーンはございません。)?\\s*$"
                with: ""
              # Trim related videos boilerplate (2026-10-07).
              - regex: "\\s*この作品の関連無料動画はこちらです。\\s*$"
                with: ""
      Studio:
        Name:
          selector: "$data//a[contains(@href,'search.php?b=')]"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""
      Tags:
        Name:
          # Exclude the その他 category (e.g. Full HD) (2026-10-07).
          selector: "$data//span[contains(@style,'table-row')][not(./span[1][normalize-space(.)='その他'])]//a[contains(@href,'search.php?c=')]"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""
      FrontImage:
        # FlexSlider injects li.clone nodes in live DOM — exclude them.
        # Verified 2026-10-08 via walkthrough (3 detail pages).
        selector: "($product//div[contains(concat(' ',normalize-space(@class),' '),' flexslider ')]//ul[contains(@class,'slides')]/li[not(contains(@class,'clone'))][1]//img/@src | //meta[@property='og:image']/@content"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.indexOf("./") === 0) v = v.substring(2);
              if (v.charAt(0) === "/") return "https://www.hunk-ch.com" + v;
              return "https://www.hunk-ch.com/" + v;

  sceneScraper:
    common:
      $product: "(//div[contains(concat(' ',normalize-space(@class),' '),' product_detail_centre ')] | //table[@id='product'])"
      $data: "(//div[contains(concat(' ',normalize-space(@class),' '),' data ')] | //p[contains(.,'発売日') and contains(.,'ブランド')])"
    scene:
      Title:
        selector: "$product//h2[1]"
        postProcess:
          - replace:
              # Trim series prefix like 【オリジナル：Full HD】 (2026-10-07).
              - regex: '^\s*【[^】]+】\s*'
                with: ""
              - regex: "^\\s+|\\s+$"
                with: ""
      Code:
        # Code also lives in input[name=code] (value like ACD-180_STINF).
        # Verified 2026-10-08 via walkthrough.
        selector: "//input[@name='code']/@value | //link[@rel='canonical']/@href | //meta[@property='og:url']/@content"
        postProcess:
          - replace:
              - regex: "^.*?[?&]code=([^&]+).*$"
                with: "$1"
              - regex: "_STINF$"
                with: ""
      Details:
        selector: "//img[@title='ストーリー']/following::p[1]"
        concat: "\n"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""
              # Trim blindfold disclaimer (2026-10-07).
              - regex: "\\s*本編メインモデルに目隠しはございません。(ウケモデルの射精シーンはございません。)?\\s*$"
                with: ""
              # Trim related videos boilerplate (2026-10-07).
              - regex: "\\s*この作品の関連無料動画はこちらです。\\s*$"
                with: ""
      URLs:
        fixed: "{inputURL}"
      Date:
        selector: "$data"
        postProcess:
          - replace:
              - regex: ".*?発売日：\\s*(\\d{4}-\\d{2}-\\d{2}).*"
                with: "$1"
          - parseDate: "2006-01-02"
      Image:
        # FlexSlider injects li.clone nodes in live DOM — exclude them.
        # Verified 2026-10-08 via walkthrough (3 detail pages).
        selector: "($product//div[contains(concat(' ',normalize-space(@class),' '),' flexslider ')]//ul[contains(@class,'slides')]/li[not(contains(@class,'clone'))][1]//img/@src | //meta[@property='og:image']/@content"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.indexOf("./") === 0) v = v.substring(2);
              if (v.charAt(0) === "/") return "https://www.hunk-ch.com" + v;
              return "https://www.hunk-ch.com/" + v;
      Studio:
        Name:
          selector: "$data//a[contains(@href,'search.php?b=')]"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""
      Tags:
        Name:
          # Exclude the その他 category (e.g. Full HD) (2026-10-07).
          selector: "$data//span[contains(@style,'table-row')][not(./span[1][normalize-space(.)='その他'])]//a[contains(@href,'search.php?c=')]"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""
      Performers:
        Name:
          # Extract performer name as 2 kanji before ( : e.g. 元貴(もとき)
          # (2026-10-07).
          selector: "$product//h2[1]"
          postProcess:
            - replace:
                - regex: '^.*?([一-龯]{1,2})[\(（][^\)）]*[\)）].*$'
                  with: "$1"
                # Clear if no match (full title is long)
                - regex: "^.{3,}$"
                  with: ""

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
