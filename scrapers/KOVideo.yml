# KO Video — sceneByURL + search scraper
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Search verification: selectors checked against rendered search DOM
#   https://ko-video.com/products/list.php?mode=search&name=雄穴
#   (2026-08-27 snapshot). sceneByURL still UNVERIFIED against live detail pages.
#
# This site uses age-gate / login. Public CDP version requires browser session.
# See: skills/stash-scraper-builder/references/scraping-failures.md
# Last Updated: 2026-10-06

name: KO Video
sceneByURL:
- action: scrapeXPath
  url:
  - ko-video.com/products/detail.php
  - www.ko-video.com/products/detail.php
  scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://ko-video.com/products/list.php?mode=search&name={}
  scraper: searchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: '{url}'
  scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://ko-video.com/products/list.php?mode=search&name={title}
  queryURLReplace:
    title:
    - regex: \.[^.]+$
      with: ''
    - regex: '[_\.]+'
      with: ' '
    - regex: \s{2,}
      with: ' '
    - regex: ^\s+|\s+$
      with: ''
  scraper: searchScraper
xPathScrapers:
  searchScraper:
    common:
      $results: //section[contains(@class,'shoppingcontents_col')]//ul[contains(@class,'item_list')]//li[.//a[contains(@href,'/products/detail.php')]]
    scene:
      Title:
        selector: $results//img[1]/@alt | $results//span[1]
        postProcess:
        - replace:
          - regex: ^\s+|\s+$
            with: ''
      Code:
        selector: $results//a[contains(@href,'/products/detail.php')]/@href
        postProcess:
        - replace:
          - regex: ^.*?[?&]product_code=([^&]+).*$
            with: $1
          - regex: \s+
            with: ''
      URLs:
        selector: $results//a[contains(@href,'/products/detail.php')]/@href
        postProcess:
        - javascript: 'var v = value || "";

            if (!v) return "";

            v = v.replace(/^\/\//, "https://");

            if (v.indexOf("http") === 0) return v;

            if (v.indexOf("/") === 0) return "https://ko-video.com" + v;

            return "https://ko-video.com/" + v;'
      Image:
        selector: $results//img[1]/@src
        postProcess:
        - javascript: 'var v = value || "";

            if (!v) return "";

            v = v.replace(/^\/\//, "https://");

            if (v.indexOf("http") === 0) return v;

            if (v.indexOf("/") === 0) return "https://ko-video.com" + v;

            return "https://ko-video.com/" + v;'
  sceneScraper:
    common:
      $meta: //div[contains(@class,'detail_product')][1]//dl[1]
      $performers: //div[contains(@class,'model_performance')][1]//div[contains(@class,'owl-carousel')]//div[@class='item']//a/span/text()
    scene:
      Title:
        selector: //div[contains(@class,'detail_main_col')]//div[@class='title_bar'][1]/h2[1]/text()
        postProcess:
        - replace:
          - regex: \s*\|\s*ゲイ DVD「KO カンパニー」公式ウェブサイト\s*KO\s*VIDEO\s*$
            with: ''
        - replace:
          - regex: ^\s+|\s+$
            with: ''
      URLs:
        fixed: '{inputURL}'
      Date:
        selector: $meta/dt[normalize-space(.)='商品発売日']/following-sibling::dd[1]/text()
        postProcess:
        - javascript: "var v = value || \"\";\nif (!v) return \"\";\nvar m = v.match(/(\\d{4})\\D+(\\d{1,2})\\D+(\\d{1,2})/u);\nif (m) {\n  var mm = (\"0\" + m[2]).slice(-2);\n  var dd = (\"0\" + m[3]).slice(-2);\n  return m[1] + \"-\" + mm + \"-\" + dd;\n}\nreturn v.trim();"
        - parseDate: '2006-01-02'
      Studio:
        Name:
          selector: $meta/dt[normalize-space(.)='メーカー/レーベル']/following-sibling::dd[1]/a[last()]/text()
          postProcess:
          - replace:
            - regex: ^\s+|\s+$
              with: ''
      Performers:
        Name:
          selector: $performers
          postProcess:
          - javascript: 'var v = value || "";

              if (!v) return "";

              var n = v.replace(/\s+/g, " ").trim();

              if (!n) return "";

              n = n.replace(/\s*[（(][぀ - ゟ゠ - ハー]+[)）]\s*/gu, "");

              var kanaLead = n.match(/^[぀ - ゟ゠ - ハー]+\s+(.+)$/u);

              if (kanaLead) n = kanaLead[1].trim();

              var mixed = n.match(/^([^\x00-\x7F]+)\s+[A-Za-z\s]+$/u);

              if (mixed) n = mixed[1].trim();

              return n;'
      Tags:
        Name:
          selector: $meta/dt[normalize-space(.)='シリーズ/ジャンル']/following-sibling::dd[1]//a/text()
          postProcess:
          - replace:
            - regex: ^\s+|\s+$
              with: ''
      Details:
        selector: //p[@class='deitail_txt']/text()[normalize-space()]
        concat: "\n"
      Image:
        selector: //div[contains(@class,'detail_main_col')]//a[contains(@class,'fancybox') and not(contains(@href,'/gallery/'))][1]/@href
        postProcess:
        - javascript: 'var v = value || "";

            if (!v) return "";

            v = v.replace(/^\/\//, "https://");

            if (v.indexOf("http") === 0) return v;

            if (v.indexOf("/") === 0) return "https://ko-video.com" + v;

            return "https://ko-video.com/" + v;'
driver:
  useCDP: true
  headers:
  - Key: User-Agent
    Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36