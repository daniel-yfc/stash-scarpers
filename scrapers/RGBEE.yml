name: RGBEE
# Rendered-DOM verified 2026-10-02 on product pages 16709, 3698, and 10772.
# Gallery (Album/ebook) heads verified 2026-10-02 on products 28934, 30976, 34891,
# and 39054 (Album+Video combined): og:title, og:image, canonical, ld+json
# sku/brand all match the shared template; body sections (facts dl, chipbar)
# were not captured on gallery products.
# Live check 2026-10-02: plain HTTP from Stash returns 403 Forbidden (anti-bot edge),
# so this scraper requires CDP with a visible Chrome; it will return nothing without it.
# Search results and /cast/ pages were not snapshotted.
driver:
  useCDP: true

sceneByURL:
  - action: scrapeXPath
    url:
      - rgbee.net/product/
    scraper: sceneScraper

# Verified 2026-10-09 on the live search page (kw=筋肉: 1,455 results,
# 35 article.card rendered): cards are article.card children of
# section.section wrap; title link at .meta/.t/a; hrefs are relative
# /product/{slug}-{productId}; thumbs are absolute
# https://staticmedia.rgbee.net/{id}/....jpg on img.art-img src
# (native loading="lazy", no data-src indirection).
sceneByName:
  action: scrapeXPath
  queryURL: https://www.rgbee.net/search?kw={}
  scraper: sceneSearch

# After a search result is picked, scrape its product page directly.
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

# Head-verified on gallery products 28934, 30976, 34891, 39054 (og:title/og:image/canonical);
# body fields rely on the shared product template verified on the video pages.
# rgbee.net serves galleries and videos from the same /product/ URL space; the same
# release may be split into separate Album/Video product IDs (e.g. No.391: 39052/39053/39054).
galleryByURL:
  - action: scrapeXPath
    url:
      - rgbee.net/product/
    scraper: galleryScraper

# UNVERIFIED: no /cast/ snapshot. Name assumes an h1; URL is the input URL.
performerByURL:
  - action: scrapeXPath
    url:
      - rgbee.net/cast/
    scraper: performerScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: &rgbeeTitle //meta[@property='og:title']/@content | //section[@id='purchase']//h1
      Code: &rgbeeCode //section[@id='purchase']/@data-product-id
      Details: &rgbeeDetails
        selector: //div[@id='about-full']/text()
        concat: "\n"
        postProcess:
          - replace:
              - regex: (?i)<br\s*/?>
                with: "\n"
              - regex: <[^>]+>
                with: ""
      Date: &rgbeeDate
        # 發行 is the release date, not the studio.
        # Page-dependent (verified 2026-10-06): pages without a 發行 field in
        # section#facts legitimately return no date — not a selector bug.
        selector: //section[@id='facts']//dt[normalize-space()='發行']/following-sibling::dd[1]
        postProcess:
          - parseDate: "2006-01-02"
      Duration:
        selector: //section[@id='facts']//dt[normalize-space()='影片長度']/following-sibling::dd[1]
        postProcess:
          - javascript: |
              var parts = value.trim().split(':').map(function (part) { return parseInt(part, 10) || 0; });
              if (parts.length === 3) return String(parts[0] * 3600 + parts[1] * 60 + parts[2]);
              if (parts.length === 2) return String(parts[0] * 60 + parts[1]);
              return value.replace(/\D/g, '');
      Image: &rgbeeImage
        selector: //meta[@property='og:image']/@content | //section[@id='purchase']//div[contains(@class,'pdp-cover')]//img/@src
        postProcess:
          - replace:
              - regex: /t-
                with: /
      URLs: &rgbeeURLs //link[@rel='canonical']/@href
      Studio: &rgbeeStudio
        Name: //section[@id='purchase']//p[contains(@class,'by')]//a
        URL:
          selector: //section[@id='purchase']//p[contains(@class,'by')]//a/@href
          postProcess:
            - replace:
                - regex: ^/
                  with: https://www.rgbee.net/
      Performers: &rgbeePerformers
        Name: //section[@id='facts']//dt[normalize-space()='主角']/following-sibling::dd[1]/a
        URL:
          selector: //section[@id='facts']//dt[normalize-space()='主角']/following-sibling::dd[1]/a/@href
          postProcess:
            - replace:
                - regex: ^/
                  with: https://www.rgbee.net/
      Tags: &rgbeeTags
        Name:
          selector: //section[@id='facts']//nav[@aria-label='標籤']/a
          postProcess:
            - replace:
                - regex: ^#
                  with: ""

  # Gallery object has no Duration or Image field; everything else mirrors sceneScraper.
  galleryScraper:
    gallery:
      Title: *rgbeeTitle
      Code: *rgbeeCode
      Details: *rgbeeDetails
      Date: *rgbeeDate
      URLs: *rgbeeURLs
      Studio: *rgbeeStudio
      Performers: *rgbeePerformers
      Tags: *rgbeeTags

  sceneSearch:
    common:
      $card: //article[contains(concat(' ', normalize-space(@class), ' '), ' card ')]
    scene:
      Title: $card/div[@class='meta']/div[@class='t']/a
      URL:
        selector: $card/div[@class='meta']/div[@class='t']/a/@href
        postProcess:
          - replace:
              - regex: ^/
                with: https://www.rgbee.net/
      Image: $card//span[@class='art']/img[@class='art-img']/@src

  performerScraper:
    performer:
      Name: //h1
      URLs:
        fixed: "{inputURL}"

# 2026-10-06: Date documented as page-dependent (no 發行 field on some pages);
# search probes (筋肉大叔 / MJD-P418 / 刺青猛男) all HIT.
# 2026-10-09: sceneSearch selectors verified against the live search page
# (kw=筋肉, article.card > .meta/.t/a + img.art-img/@src); UNVERIFIED tag removed.
# Last Updated: 2026-10-09
