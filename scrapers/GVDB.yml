# GVDB performer scraper (md.gvdb.org) — performerByURL only, performer fields only.
# No scene modes and no search modes: GVDB model pages are the only source used.
#
# Page structure (verified 2026-11-03 against user-supplied rendered HTML for
# models 159685 and 54676):
# - WordPress post: <article id="post-<GVDB ID>">, body in div.entry-content.
# - The first <p> holds the profile lines as <br>-separated text nodes:
#   "Name: <names>", "Age: ..", "Height: ..", "Weight: ..", "P-Size: ..cm",
#   "Works:", then the first "[ Studio ] <names>" heading as its last text node.
# - Every later "[ Studio ] <names>" heading is its own <p>, followed by a <ul>
#   of works. A studio's works may be split per stage name, repeating the name
#   as a standalone <p> (54676: "旬（しゅん） Shun", "yuto").
# - "[ Subscription Channel ]" is a heading <p> whose following <ul> holds the
#   performer's external channel links (54676: MyFans / OnlyFans / CandFans /
#   Libidox). 159685 has no such section and no <a> at all in .entry-content.
# - Studios:/Tags:/Published: live in the article footer, outside .entry-content,
#   so Country keyword matching scoped to .entry-content ignores footer/comments.
#   The footer is a <ul class="meta ..."> inside the same <article>: Studios:
#   is li.meta-cat (category links), Tags: is li.meta-tags holding one
#   <a rel="tag" href=".../tag/<slug>/">Display Name</a> per tag (an empty
#   Tags: item shows "-" and has no anchors). The site-wide tag cloud in the
#   sidebar also uses /tag/ links on every page and must never be scraped;
#   the Tags selector below is scoped to li.meta-tags inside the article.
# - The first <img> in .entry-content precedes every "[ Studio ]" heading on
#   all thirteen samples, i.e. it is the performer's profile photo; later
#   <img>s sit inside works sections and are stills. 6155's first img is a
#   cover-style crop with burned-in title text (filename 32848.jpg.webp does
#   not carry the post ID); the plain first-img rule was accepted anyway
#   (user ruling 2026-11-03).
#
# Name grammar: a name list is one or more name-sets separated by " / ".
# Each set is [JP name] [(kana) or （kana）] [Romaji], any part may be missing
# (JP+Romaji, Romaji-only, JP-only). A profile may add an "AKA:" line with
# more name-sets (6155), and a set may carry a "(or <name-set>)" alternate
# (6155: "ボブ Bobu (orしゅん Shun)") — the "(or …)" content is another
# name-set, not a kana reading. The Romaji segment is the trailing ASCII
# part; everything before it is the JP name. A space inside the JP name is
# cleaned away in the output (6180: page "加藤 拓 Kato Taku" -> Name "加藤拓",
# alias "Kato Taku"); spaces inside Romaji are kept. Kana readings never kept.
# Bracketed text is a studio/series name, never a performer name
# (e.g. "[ Yutoの秘密部屋 ]" has no name after "]").
#
# Name-grammar hardening (2026-11-04, from a 3000-record dataset scan and
# an 18-page logic batch over the production-linked performers): readings
# are stripped before the set split in ALL code paths (Name, primaryOf,
# parseSets) and the strip accepts mixed half/full-width paren pairs; a
# set whose JP/Romaji boundary has no space is split at the character-
# class boundary; the JP whitelist also covers 々, 〇, the mask circles
# ○/◯ and the CJK compatibility ideographs, and permits one leading or
# trailing Romaji letter in a JP name; the Romaji segment allows Latin
# Extended letters; a heading may carry a second bracketed group, which
# is stripped like the first; a trailing "." after the Romaji is
# punctuation, not part of the name. Deliberately unchanged: digit
# rejection (load-bearing against model codes and descriptive non-names;
# the numbered-name page 72917 stays a known limitation).
#
# Follow-up (same day, from the 004+007 dataset scan): splitSet now
# retries the joined split when the spaced split's JP candidate fails
# the whitelist — with a space-less boundary before a multiword Romaji
# ("橋蔵陽Hashikura Akira") the set was dropped whole and the primary
# leaked into Aliases wherever a spaced variant of it parsed (66132,
# 128684) — and a set that is Romaji-only as a whole is kept as a
# Romaji-only name even when it has several words ("Isaki Yuto" on
# 64822 was previously dropped because its first word was misread as
# the JP part). Still open (tracked, not fixed): mask/star characters
# inside the Romaji segment (〇 in "Base〇") and the ●/★ symbols.
#
# O1 follow-up (2026-11-10): a parenthetical holding only Romaji is
# an alternate romanization, not a kana reading — parseSets lifts it
# out as an extra name-set, like the "(or ...)" alternates
# (126493: "安斎黎太郎 Anzai Ryotaro (Reitaro)" gains the alias
# Reitaro; "匠海 (TAKUMI)" gains TAKUMI). Parentheticals containing
# kana, digits or anything else are still stripped as readings.
# Fixtures: the live 126493 page plus logic cases; a rescan of all
# 10,436 dataset records changed 20 records, all alias gains of the
# parenthetical Romaji, zero losses, zero Name changes.
#
# Transport: plain HTTP; no CDP. Early testing (2026-10 and 2026-11) saw
# 403s from md.gvdb.org and concluded CDP was required, but that was a
# User-Agent issue: with the browser User-Agent sent by the driver block
# below, plain fetches serve everything this scraper needs. A live A/B
# on stash-test (2026-11-15) proved it: useCDP:false returned
# byte-identical results on 7/7 pages (77/77 field checks) at ~0.8s/page
# vs ~3.7s/page with CDP. CDP was removed the same day on the user's
# ruling; the User-Agent header stays, as it is what the site checks.
#
# GVDB ID custom field: YAML scrapers cannot return custom_fields (the
# v0.31.1 scraper schema has no such performer field; upstream stash #6394).
# Companion tool tools/gvdb_custom_fields.py writes it afterwards via GraphQL
# performerUpdate custom_fields partial, deriving the ID from the performer's
# md.gvdb.org URL kept in URLs by this scraper. Dry-run by default.
#
# Verification status (2026-11-03): every XPath below was executed against
# thirteen rendered HTML pages (lxml) and every javascript postProcess was
# executed in node on the extracted values — 143/143 field checks match the
# expected values exactly (see GVDB.test.yaml; the count includes the Image
# and Tags fields added 2026-11-03). Covered branches: Country
# TW via Taiwan-label studio majorities (161913, 161611) and via profile
# keywords (161064, 72533), Country blank via an Asia keyword in a heading
# line (22153 via 亜細亜 in the AMW label), Country JP despite an アジア
# work title in <li> (6142, 6194 — under the graded rule, work titles are
# not Country evidence), all-blank numeric fields (22153,
# 72533, 53003, 117270, 6142, 6155), JP name with a space (6180), two studio
# brackets on one heading line (72533), Romaji-only name "Mr. J" (6142),
# profile AKA line + "(or …)" alternate name-sets (6155), Subscription
# Channel links incl. FansOne (54676, 161913, 161611 — all direct hrefs in
# the page HTML, no redirect wrappers). Profile label lines may lack the
# colon ("Height 177" on 126493, a bare "Height" line on 157152): the
# numeric selectors therefore match the label without a colon, and the
# Aliases parser explicitly skips colon-less label lines so they are never
# misread as stage names. A kana reading may contain "/" (20575:
# "(あきひと/みなと)"), so readings are stripped before name-sets are
# split. Additional performer pages from derived-ID and user-specified
# rounds pass at the javascript-logic level only.
# Image and Tags (added 2026-11-03, user rulings): the Image selector and
# the Tags slug filter + slug-to-JP-name mapping were executed against the
# same thirteen rendered HTML pages (footer li.meta-tags anchors read from
# the DOM) and match the expected values in GVDB.test.yaml; the Tags
# mapping was additionally checked at the logic level against the footer
# tag lists of the other 43 verified performer pages (56 pages total, 15
# distinct footer tags, 8 kept by the closed allowlist).
# Stash runtime (production lxc:9999, 2026-11-03/04): all fields live
# at 130/143 — every field correct except the performer image, whose
# root cause is documented at the Images field below; the fix there is
# pending its own runtime re-test.
# Parser hardening (2026-11-04): after the Images fix the runtime stands
# at 143/143. The name-grammar hardening above was regression-tested
# offline only: the 13 rendered pages still pass 143/143 end-to-end,
# the 36 sim-batch logic pages still pass, the 18 production-linked
# pages pass 196/198 (the two remaining fields are 72917's Name/Aliases,
# the tracked digit limitation), and ten category fixture pages
# (3940, 999, 31245, 34951, 31025, 3608, 4988, 580, 35451, 100941)
# pass 110/110. The splitSet follow-up above adds three fixture pages
# (128684, 66132, 64822; 39/39 checks incl. reconstructed inputs) and
# was re-verified against the same corpora with no regressions; a
# rescan of the 4000-record 004+007 datasets shows zero primary leaks
# (was 2) and 26 changed records, all alias gains except the two leak
# removals. The O1 follow-up (2026-11-10) adds the live 126493 page
# plus logic cases (25/25) and was re-verified against the same
# corpora with no regressions. Stash runtime re-test of the hardened
# parser: NOT_RUN.
name: GVDB

driver:
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36

performerByURL:
  - action: scrapeXPath
    url:
      - md.gvdb.org/
    scraper: performerScraper

xPathScrapers:
  performerScraper:
    common:
      $entry: "//div[contains(concat(' ', normalize-space(@class), ' '), ' entry-content ')]"
    performer:
      Name:
        selector: "$entry/p[1]/text()[contains(.,'Name:')]"
        postProcess:
          - javascript: |
              var v = value || "";
              v = v.replace(/^\s*Name:\s*/, "");
              // Strip kana readings BEFORE taking the first name-set: a
              // reading may itself contain "/" (3940: "後藤珊二 (サンジ /
              // さんじ) Goto Sanji"), and the strip accepts mixed
              // half/full-width paren pairs (4988: "卓哉（たくや) Takuya").
              var first = (v.replace(/[\(（][^\)）]*[\)）]/g, "").split("/")[0] || "").replace(/\s+/g, " ").trim();
              // A trailing "." is sentence punctuation, not part of the
              // Romaji (580: the page shows "Mizushima Raimu.").
              first = first.replace(/([A-Za-z\u00C0-\u024F])\.$/, "$1");
              // The JP name is everything before the trailing Romaji segment.
              // A space inside the JP name is cleaned away (6180: the page
              // shows "加藤 拓 Kato Taku"; the stored Name is "加藤拓").
              // Spaces inside the Romaji segment are kept ("Kato Taku").
              // The JP whitelist covers 々 (U+3005), 〇 (U+3007), the
              // mask circles ○/◯ and the CJK compatibility ideographs,
              // and a JP name may carry one leading or
              // trailing Romaji letter (J君; the G-suffix names such as
              // プロレスG). The Romaji segment allows Latin Extended
              // letters (35451: "Yōhei").
              var JP = "[\\u3005\\u3007\\u25CB\\u25EF\\u3040-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uFA0E-\\uFA6D]";
              var ROMA = "A-Za-z\\u00C0-\\u024F";
              var JP_NAME = new RegExp("^[A-Za-z]?" + JP + "+(?:\\s+" + JP + "+)*[A-Za-z]?$");
              var m = first.match(new RegExp("^(.*?)\\s+([" + ROMA + "]+(?:[ .'-]+[" + ROMA + "]+)*)$"));
              if (m && m[1] && JP_NAME.test(m[1])) return m[1].replace(/\s+/g, "");
              // No space between the JP name and the Romaji (100941:
              // "彰馬（しょうま）Shouma" — once the reading is stripped
              // no separator remains): split at the class boundary.
              var mj = first.match(new RegExp("^(" + JP + "+)([" + ROMA + "]+(?:[ .'-]+[" + ROMA + "]+)*)$"));
              if (mj && JP_NAME.test(mj[1])) return mj[1].replace(/\s+/g, "");
              if (JP_NAME.test(first)) return first.replace(/\s+/g, "");
              return first;
      Aliases:
        # All <p> text lines of .entry-content: the Name line, an optional
        # profile "AKA:" line (6155), every "[ Studio ] <names>" heading,
        # and standalone stage-name <p>s. Other label lines (Age:/Height:/...)
        # contain ":" and are skipped; work titles live in <li>, never in
        # <p>, so they cannot leak in. A "(or <name-set>)" parenthetical is
        # an alternate name-set, not a kana reading, and is kept as a set;
        # a Romaji-only parenthetical is likewise kept as an extra set
        # (an alternate romanization), never stripped as a reading.
        # The javascript parses name-sets, drops kana readings, drops the
        # primary Name, drops decorative non-name sets (e.g. the kaomoji
        # stage name on 54676) via a strict JP/Romaji character whitelist,
        # dedupes, and joins with ", " (Stash splits Aliases on ",").
        selector: "$entry/p/text()"
        concat: "\n"
        postProcess:
          - javascript: |
              // The JP whitelist covers 々 (U+3005), 〇 (U+3007) and the
              // mask circles ○/◯ and the CJK compatibility ideographs
              // alongside the kana/kanji ranges; a JP name
              // may carry one leading or trailing Romaji letter (J君; the
              // G-suffix names such as プロレスG). The Romaji segment
              // allows Latin Extended letters (35451: "Yōhei").
              var JP_CHARS = "[\\u3005\\u3007\\u25CB\\u25EF\\u3040-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uFA0E-\\uFA6D]";
              var ROMA_CHARS = "A-Za-z\\u00C0-\\u024F";
              var JP_NAME_RE = new RegExp("^[A-Za-z]?" + JP_CHARS + "+(?:\\s+" + JP_CHARS + "+)*[A-Za-z]?$");
              var ROMAJI_RE = new RegExp("^[" + ROMA_CHARS + "]+(?:[ .'-]+[" + ROMA_CHARS + "]+)*$");
              var SPACED_RE = new RegExp("^(.*?)\\s+([" + ROMA_CHARS + "]+(?:[ .'-]+[" + ROMA_CHARS + "]+)*)$");
              var JOINED_RE = new RegExp("^(" + JP_CHARS + "+)([" + ROMA_CHARS + "]+(?:[ .'-]+[" + ROMA_CHARS + "]+)*)$");
              // Split one cleaned name-set into [jp, romaji]; null when the set
              // is not a plausible name (e.g. decorative kaomoji stage names).
              // The JP part is everything before the trailing Romaji segment
              // and may contain a space ("加藤 拓 Kato Taku").
              function splitSet(s) {
                var jp = "",
                  romaji = "";
                var m = s.match(SPACED_RE);
                if (m && JP_NAME_RE.test(m[1])) {
                  jp = m[1];
                  romaji = m[2];
                } else if ((m = s.match(JOINED_RE))) {
                  // No space between the JP name and the Romaji (100941:
                  // the page shows "彰馬（しょうま）Shouma"; once the
                  // reading is stripped no separator remains): split at
                  // the character-class boundary instead. This is also
                  // the retry for a spaced split whose JP candidate is
                  // not a plausible JP name because the boundary space
                  // is missing before a multiword Romaji (128684:
                  // "橋蔵陽Hashikura Akira" — without the retry the set
                  // was dropped whole and the primary leaked into
                  // Aliases wherever a spaced variant of it parsed).
                  jp = m[1];
                  romaji = m[2];
                } else if (ROMAJI_RE.test(s)) {
                  // A Romaji-only name-set, one or more words (64822:
                  // "Isaki Yuto"). Reached only when no JP reading of
                  // the set works: the spaced split would otherwise
                  // misread the first Romaji word as the JP part and
                  // drop the whole set.
                  romaji = s;
                } else {
                  jp = s;
                }
                if (jp && !JP_NAME_RE.test(jp)) return null;
                if (!jp && !romaji) return null;
                // Clean spaces out of the JP name ("加藤 拓" -> "加藤拓");
                // Romaji word spaces stay ("Kato Taku").
                return [jp.replace(/\s+/g, ""), romaji];
              }
              function primaryOf(nameLine) {
                // Same order as parseSets and the Name field: strip kana
                // readings BEFORE splitting on "/" — a reading may itself
                // contain "/" (3940: "後藤珊二 (サンジ / さんじ)"), and the
                // strip accepts mixed half/full-width paren pairs.
                var first = nameLine.substring(5).replace(/[\(（][^\)）]*[\)）]/g, "").split("/")[0].replace(/\s+/g, " ").trim();
                // A trailing "." is sentence punctuation (580).
                first = first.replace(/([A-Za-z\u00C0-\u024F])\.$/, "$1");
                var parts = splitSet(first);
                if (parts && parts[0]) return parts[0];
                return first;
              }
              function parseSets(str, primary, out, seen) {
                // A parenthetical "(or <name-set>)" is an alternate name-set,
                // not a kana reading (6155: "ボブ Bobu (orしゅん Shun)"): lift
                // it out as an extra set before other parentheticals are
                // stripped as readings.
                var extra = [];
                str = str.replace(/[\(（]or\s*([^\)）]*)[\)）]/gi, function (m, g) {
                  extra.push(g);
                  return " ";
                });
                // A parenthetical holding only Romaji is not a kana
                // reading either: it is an alternate romanization
                // (126493: "安斎黎太郎 Anzai Ryotaro (Reitaro)") or the
                // set's only Romaji ("匠海 (TAKUMI)"): lift it out as
                // an extra set, like the "(or ...)" alternates above.
                // Parentheticals with kana, digits or anything else in
                // them are still stripped as readings below.
                str = str.replace(/[\(（]([A-Za-z\u00C0-\u024F]+(?:[ .'-]+[A-Za-z\u00C0-\u024F]+)*)[\)）]/g, function (m, g) {
                  extra.push(g);
                  return " ";
                });
                // Strip kana readings BEFORE splitting the name-sets: a
                // reading may itself contain "/" (20575: "湊 (あきひと/みなと)
                // Akihito / Minato"), which is not a set separator. The
                // strip accepts mixed half/full-width paren pairs
                // (4988: "卓哉（たくや) Takuya").
                str = str.replace(/[\(（][^\)）]*[\)）]/g, "");
                var parts = str.split("/").concat(extra);
                for (var i = 0; i < parts.length; i++) {
                  var s = parts[i].replace(/[\(（][^\)）]*[\)）]/g, "").replace(/\s+/g, " ").trim();
                  // A trailing "." is sentence punctuation (580).
                  s = s.replace(/([A-Za-z\u00C0-\u024F])\.$/, "$1");
                  if (!s) continue;
                  var pair = splitSet(s);
                  if (!pair) continue;
                  var names = [];
                  if (pair[0]) names.push(pair[0]);
                  if (pair[1]) names.push(pair[1]);
                  for (var j = 0; j < names.length; j++) {
                    var n = names[j];
                    if (n === primary || seen[n]) continue;
                    seen[n] = true;
                    out.push(n);
                  }
                }
              }
              var lines = (value || "").split("\n");
              var primary = "";
              for (var a = 0; a < lines.length; a++) {
                var t = lines[a].trim();
                if (t.indexOf("Name:") === 0) {
                  primary = primaryOf(t);
                  break;
                }
              }
              var out = [];
              var seen = {};
              for (var b = 0; b < lines.length; b++) {
                var line = lines[b].trim();
                if (!line) continue;
                if (line.indexOf("Name:") === 0) {
                  parseSets(line.substring(5), primary, out, seen);
                  continue;
                }
                if (line.indexOf("AKA:") === 0) {
                  // Profile "AKA:" line (6155): more stage names, same grammar.
                  parseSets(line.substring(4), primary, out, seen);
                  continue;
                }
                if (line.charAt(0) === "[") {
                  var close = line.indexOf("]");
                  if (close < 0) continue;
                  var suffix = line.substring(close + 1).trim();
                  // A heading may carry a second bracketed group
                  // ("[ Studio ] [ Series ] Name"): bracketed text is a
                  // studio/series name, never part of the performer's
                  // name, so further leading groups are stripped too.
                  while (suffix.charAt(0) === "[") {
                    var c2 = suffix.indexOf("]");
                    if (c2 < 0) {
                      suffix = "";
                      break;
                    }
                    suffix = suffix.substring(c2 + 1).trim();
                  }
                  if (suffix) parseSets(suffix, primary, out, seen);
                  continue;
                }
                // Profile label lines carry a colon ("Age:", "Works:") and
                // are skipped below — but a colon-less label line exists in
                // the wild (157152: a bare "Height" line) and would otherwise
                // be misread as a standalone stage name.
                if (/^(?:Age|Height|Weight|P-Size|Works)\b/.test(line)) continue;
                if (line.indexOf(":") >= 0 || line.indexOf("[") >= 0) continue;
                parseSets(line, primary, out, seen);
              }
              return out.join(", ");
      PenisLength:
        selector: "$entry/p[1]/text()[contains(.,'P-Size')]"
        postProcess:
          - javascript: |
              var m = (value || "").match(/([0-9]+(?:\.[0-9]+)?)/);
              return m ? m[1] : "";
      Height:
        selector: "$entry/p[1]/text()[contains(.,'Height')]"
        postProcess:
          - javascript: |
              var m = (value || "").match(/([0-9]+(?:\.[0-9]+)?)/);
              return m ? m[1] : "";
      Weight:
        selector: "$entry/p[1]/text()[contains(.,'Weight')]"
        postProcess:
          - javascript: |
              var m = (value || "").match(/([0-9]+(?:\.[0-9]+)?)/);
              return m ? m[1] : "";
      Gender:
        fixed: MALE
      Country:
        # Graded keyword rule (user-set 2026-11-03; graded refinement the
        # same day after 126493): only the <p> lines are evidence — the
        # profile lines and the "[ Studio ]" heading lines. Work titles
        # live in <li> and never count. TW when a Taiwan keyword
        # (台湾/Taiwan/Gayerdar) appears in a Name/AKA profile line, or
        # when Taiwan-label studios form the majority of the studio
        # headings (Subscription excluded). Empty when an Asia keyword
        # (アジア/亜細亜) appears in a profile or heading line — the
        # page's own label is Asia-level with no country (22153). JP
        # otherwise. 126493 is a JP performer with one Taiwan-label
        # release among 14 studio groups plus an アジア marketing work
        # title, so it resolves to JP; 6194/6142 likewise resolve to JP
        # because their only アジア evidence is a work title.
        selector: "$entry/p/text()"
        concat: "\n"
        postProcess:
          - javascript: |
              var TW_RE = /台湾|Taiwan|Gayerdar/i;
              var ASIA_RE = /アジア|亜細亜/;
              var lines = (value || "").split("\n");
              var profileTW = false;
              var strongAsia = false;
              var studios = 0;
              var twStudios = 0;
              for (var i = 0; i < lines.length; i++) {
                var line = lines[i].replace(/\s+/g, " ").trim();
                if (!line) continue;
                if (/^(?:Name|AKA):/.test(line)) {
                  if (TW_RE.test(line)) profileTW = true;
                  if (ASIA_RE.test(line)) strongAsia = true;
                } else if (line.charAt(0) === "[") {
                  if (ASIA_RE.test(line)) strongAsia = true;
                  if (!/Subscription/i.test(line)) {
                    studios++;
                    var close = line.indexOf("]");
                    var bracket = close >= 0 ? line.substring(0, close + 1) : line;
                    if (TW_RE.test(bracket)) twStudios++;
                  }
                }
              }
              if (profileTW || (studios > 0 && twStudios * 2 > studios)) return "TW";
              if (strongAsia) return "";
              return "JP";
      Ethnicity:
        fixed: Asian
      URLs:
        # The performer's GVDB page (canonical), then every link in the
        # "[ Subscription Channel ]" list when the section exists.
        selector: "//link[@rel='canonical']/@href | //div[contains(concat(' ', normalize-space(@class), ' '), ' entry-content ')]/p[contains(normalize-space(.),'Subscription Channel')]/following-sibling::ul[1]//a/@href"
      Images:
        # Plain first-image rule (user ruling 2026-11-03): the first <img>
        # in .entry-content is the profile photo on all thirteen samples
        # (it precedes every "[ Studio ]" heading); later images are work
        # stills. 6155's first image is a cover-style crop — accepted.
        # Field MUST be the plural "Images". The singular "Image" field
        # is deprecated for performer scrapers: Stash downloads a
        # singular Image URL server-side and replaces it with the fetched
        # bytes (pkg/scraper/image.go, setPerformerImage), silently
        # dropping it when the fetch fails. md.gvdb.org refuses
        # fetches that do not carry a browser User-Agent, and that
        # server-side download does not send the driver headers below,
        # so a singular Image always came back empty at runtime
        # (production evidence 2026-11-03/04: 130/143 with Image null on
        # 13/13, under two different selector shapes; the selector was
        # never the problem). "Images" values pass through as URLs
        # untouched. The selector is scoped to the first paragraph (the
        # profile block, which holds the profile photo on all thirteen
        # samples) so exactly one image matches.
        selector: "$entry/p[1]//img[1]/@src"
      Tags:
        Name:
          # Closed allowlist (user ruling 2026-11-03) over the article
          # footer's li.meta-tags anchors, matched by tag slug; the
          # javascript maps each slug to the JP tag name only (the page's
          # bilingual display text, e.g. "刺青 Tattoo", is NOT used).
          # Inventory basis: all 56 verified performer pages carry 15
          # distinct footer tags; only these are kept, everything else
          # (Subscription Channel, Asian, Monthly Top GV Model, 三連結
          # 3Some, ...) is dropped. Slugs observed paired with their
          # display names on the pages noted in GVDB.test.yaml.
          # 2026-11-14: the site renamed the sunburned slug to tanned
          # (display now just 日焼, user ruling); both slugs are
          # matched, sunburned kept for archived pages and mirrors.
          selector: "//article[starts-with(@id,'post-')]//li[contains(concat(' ', normalize-space(@class), ' '), ' meta-tags ')]/a[@rel='tag'][contains(@href,'/tag/beard/') or contains(@href,'/tag/sunburned/') or contains(@href,'/tag/tanned/') or contains(@href,'/tag/tattoo/') or contains(@href,'/tag/six-pack/') or contains(@href,'/tag/chubby-bear/') or contains(@href,'/tag/big-dick/') or contains(@href,'/tag/squirting/') or contains(@href,'/tag/chest-hair/')]/@href"
          postProcess:
            - javascript: |
                var MAP = {
                  "beard": "髭",
                  "sunburned": "日焼/色黒",
                  "tanned": "日焼",
                  "tattoo": "刺青",
                  "six-pack": "腹筋",
                  "chubby-bear": "豊満",
                  "big-dick": "巨根",
                  "squirting": "潮吹",
                  "chest-hair": "胸毛"
                };
                var m = (value || "").match(/\/tag\/([^/]+)\//);
                return m && MAP[m[1]] ? MAP[m[1]] : "";

