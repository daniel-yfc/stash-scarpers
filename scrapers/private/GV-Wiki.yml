# GV-Wiki
# Private scraper: requires session cookie. Do NOT commit to public scrapers/.
# Verification: live-DOM verified 2026-10-06 (Title/Image/Details fixed).
# 2026-10-06: Details fixed — #plot-box holds text nodes + <br>, no <p>.
# (Title/Image already used the robust class-token pattern.)
# Last Updated: 2026-10-10
# Validator fixes:
#   - removed CookieURL (not allowed when useCDP is true)
#   - sceneByURL regex -> simple prefix (url items are plain strings)
#   - {query} -> {} (Stash sceneByName only substitutes the {} placeholder)
#   - replaced invalid `trim` postProcess with replace-regex trim
#   - inlined $main into $info (recursive common fragments are not supported)

name: GV-Wiki

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
  cookies:
    - Cookies:
        - Name: "REPLACE_WITH_CURRENT_SESSION_COOKIE_NAME"
          Value: "REPLACE_WITH_CURRENT_SESSION_COOKIE_VALUE"
          Domain: ".www.gvwiki.com"
          Path: "/"

sceneByURL:
  - action: scrapeXPath
    url:
      - gvwiki.com/video/
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.gvwiki.com/search?q={}&r=vm"
  scraper: searchScraper

# Identify disabled: this entry returned a keyword-results page as one scene.
# Use sceneByName and select a result for sceneByQueryFragment instead.
# See docs/metadata-feed-integration.md (2026-10-10).

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//a[contains(@href, '/video/')][not(contains(@href, '/video/search'))]"
    scene:
      Title:
        selector: "$results/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      URLs:
        selector: "$results/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              return /^https?:\/\//.test(v) ? v : "https://gvwiki.com" + v;

  sceneScraper:
    common:
      $main: "//main"
      $info: "//main//table[contains(concat(' ', normalize-space(@class), ' '), ' is-fullwidth ')]"
    scene:
      Title:
        selector: "$main//h1[contains(concat(' ', normalize-space(@class), ' '), ' title ')]/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Code:
        selector: "$info//tr[td[1][normalize-space()='ID']]/td[2]/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Date:
        selector: "$info//tr[td[1][normalize-space()='Release Date']]/td[2]/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
          - parseDate: "2006-01-02"
      Details:
        # Live DOM (2026-10-06): #plot-box holds text nodes + <br>, no <p>
        # elements — the old //p selector never matched. Grab text nodes.
        selector: "$main//*[@id='plot-box']//text()[normalize-space()]"
        concat: "\n"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Image:
        selector: "$main//div[contains(concat(' ', normalize-space(@class), ' '), ' swiper-slide ')][1]//img/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              return /^https?:\/\//.test(v) ? v : "https://gvwiki.com" + v;
      Studio:
        Name:
          selector: "$info//tr[td[1][normalize-space()='Company']]/td[2]/text()"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
      Tags:
        Name:
          selector: "$info//tr[td[1][normalize-space()='Tag']]/td[2]//a/text()"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
      Performers:
        Name:
          selector: "$main//a[starts-with(@href, '/model/')]/text()"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
      URLs:
        selector: "$info//tr[td[1][normalize-space()='Buy']]/td[2]//a/@href | //link[@rel='canonical']/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              return /^https?:\/\//.test(v) ? v : "https://gvwiki.com" + v;
