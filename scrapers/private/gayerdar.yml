# Gayerdar scraper. Historical zh-TW rendered-DOM inspection is recorded in
# evidence/gayerdar-scraper-development-2026-09-28.md. Reproducible fixture
# verification and live Stash/CDP verification are not established.
# No cookies, credentials, tokens, or browser profile data.
#
# Fragility notes:
# - performerScraper Height/Weight anchor on Tailwind utility class text-D1D0CF.
# - sceneSearchScraper per-field card selectors work positionally; not live-verified.
# - Title selectors split on fullwidth ｜, which depends on zh-TW page chrome.
name: Gayerdar

sceneByURL:
  - action: scrapeXPath
    url:
      - "gayerdar.com/zh-TW/videos/"
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?videos/"
          with: "gayerdar.com/zh-TW/videos/"
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneSearchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  queryURLReplace:
    url:
      - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?videos/"
        with: "gayerdar.com/zh-TW/videos/"
  scraper: sceneScraper

performerByURL:
  - action: scrapeXPath
    url:
      - "gayerdar.com/zh-TW/models/"
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?models/"
          with: "gayerdar.com/zh-TW/models/"
    scraper: performerScraper

performerByFragment:
  action: scrapeXPath
  scraper: performerScraper

performerByName:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: performerSearchScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //title/text()
        postProcess:
          - replace:
              - regex: "｜.*$"
                with: ""
              - regex: "\\|.*$"
                with: ""
      Code:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: ".*/videos/([^/]+).*"
                with: "$1"
              - regex: ".*/clips/([^/]+).*"
                with: "$1"
      Date:
        selector: //meta[@property="video:release_date"]/@content
        postProcess:
          - parseDate: "20060102"
      Image:
        selector: //meta[@property="og:image"]/@content
      Studio:
        Name:
          fixed: "Gayerdar"
      Tags:
        Name: //ul[contains(@class,"iq-blogtag")]/li/a[contains(@class,"title")]/text()
      Performers:
        Name:
          selector: //a[contains(@href,"/models/")]
          subSelector: .//h6[contains(@class,"title")]/text()
      URLs:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: "^/"
                with: "https://gayerdar.com/"
              - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?videos/"
                with: "gayerdar.com/zh-TW/videos/"

  performerScraper:
    performer:
      Name:
        selector: //title/text()
        postProcess:
          - replace:
              - regex: "｜.*$"
                with: ""
              - regex: "\\|.*$"
                with: ""
      Gender:
        fixed: "male"
      Country:
        selector: //p[contains(@class,"text-D1D0CF")][contains(text(),"From")]/text()
        postProcess:
          - replace:
              - regex: ".*From\\s+"
                with: ""
      Height:
        selector: //p[contains(@class,"text-D1D0CF")][contains(text(),"cm")]/text()
        postProcess:
          - replace:
              - regex: ".*?(\\d+)\\s*cm.*"
                with: "$1"
      Weight:
        selector: //p[contains(@class,"text-D1D0CF")][contains(text(),"kg")]/text()
        postProcess:
          - replace:
              - regex: ".*?(\\d+)\\s*kg.*"
                with: "$1"
      Image:
        selector: //meta[@property="og:image"]/@href
      URLs:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: "^/"
                with: "https://gayerdar.com/"
              - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?models/"
                with: "gayerdar.com/zh-TW/models/"

  sceneSearchScraper:
    scene:
      Title:
        selector: .//div[contains(@class,"vitem")][contains(@class,"video-item")][.//a[contains(@href,"/videos/")]]//h6[contains(@class,"title")]/text()
      Image:
        selector: .//div[contains(@class,"vitem")][contains(@class,"video-item")][.//a[contains(@href,"/videos/")]]//img[contains(@class,"video-img")][1]/@src
      URL:
        selector: .//div[contains(@class,"vitem")][contains(@class,"video-item")][.//a[contains(@href,"/videos/")]]//a[contains(@href,"/videos/")][1]/@href
        postProcess:
          - replace:
              - regex: "^/"
                with: "https://gayerdar.com/"

  performerSearchScraper:
    performer:
      Name:
        selector: .//div[contains(@class,"vitem")][contains(@class,"model-item")][.//a[contains(@href,"/models/")]]//h6[contains(@class,"title")]/text()
      Image:
        selector: .//div[contains(@class,"vitem")][contains(@class,"model-item")][.//a[contains(@href,"/models/")]]//img[contains(@class,"model-img")][1]/@src
      URL:
        selector: .//div[contains(@class,"vitem")][contains(@class,"model-item")][.//a[contains(@href,"/models/")]]//a[contains(@href,"/models/")][1]/@href
        postProcess:
          - replace:
              - regex: "^/"
                with: "https://gayerdar.com/"

driver:
  useCDP: true

# Last Updated: 2026-10-05
