# Gayerdar scraper. Historical zh-TW rendered-DOM inspection (2026-09-28,
# record not committed to this repo). Reproducible fixture
# verification and live Stash/CDP verification are not established.
# No cookies, credentials, tokens, or browser profile data.
#
# Fragility notes:
# - performerScraper Height/Weight anchor on Tailwind utility class text-D1D0CF.
# - Title selectors split on fullwidth ｜, which depends on zh-TW page chrome.
# 2026-10-06: Tags gained plain-text li fallback (some pages render tags
# without links) against live DOM.
# Last Updated: 2026-10-10
name: Gayerdar

# Name search omitted: {url} is not substituted by Stash ByName.
# Restore only after verifying a real keyword endpoint using {}.
sceneByURL:
  - action: scrapeXPath
    url:
      - "gayerdar.com/zh-TW/videos/"
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?videos/"
          with: "gayerdar.com/zh-TW/videos/"
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  queryURLReplace:
    url:
      - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?videos/"
        with: "gayerdar.com/zh-TW/videos/"
  scraper: sceneScraper

performerByURL:
  - action: scrapeXPath
    url:
      - "gayerdar.com/zh-TW/models/"
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?models/"
          with: "gayerdar.com/zh-TW/models/"
    scraper: performerScraper

performerByFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: performerScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //title/text()
        postProcess:
          - replace:
              - regex: "｜.*$"
                with: ""
              - regex: "\\|.*$"
                with: ""
      Code:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: ".*/videos/([^/]+).*"
                with: "$1"
              - regex: ".*/clips/([^/]+).*"
                with: "$1"
      Date:
        selector: //meta[@property="video:release_date"]/@content
        postProcess:
          - parseDate: "20060102"
      Image:
        selector: //meta[@property="og:image"]/@content
      # Studio: omitted (2026-10-10). Was hardcoded fixed: "Gayerdar" — Gayerdar
      # is the platform/site, not a production studio, and video pages expose
      # no studio field. A hardcoded platform name would pollute Studio
      # entities and AutoTagging; empty is better than wrong.
      Tags:
        # Live DOM (2026-10-06): linked variant is ul.iq-blogtag li a.title
        # (the <a> has no href); some pages render plain-text li nodes
        # instead — union both, strip separators.
        Name:
          selector: //ul[contains(@class,"iq-blogtag")]/li/a[contains(@class,"title")]/text() | //ul[contains(@class,"iq-blogtag")]/li/text()[normalize-space()]
          postProcess:
            - replace:
                - regex: '^[，、,]\s*|\s*[，、,]$'
                  with: ""
                - regex: '^\s+|\s+$'
                  with: ""
      Performers:
        Name:
          selector: //a[contains(@href,"/models/")]//h6[contains(@class,"title")]/text()
      URLs:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: "^/"
                with: "https://gayerdar.com/"
              - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?videos/"
                with: "gayerdar.com/zh-TW/videos/"

  performerScraper:
    performer:
      Name:
        selector: //title/text()
        postProcess:
          - replace:
              - regex: "｜.*$"
                with: ""
              - regex: "\\|.*$"
                with: ""
      Gender:
        fixed: "male"
      Country:
        selector: //p[contains(@class,"text-D1D0CF")][contains(text(),"From")]/text()
        postProcess:
          - replace:
              - regex: ".*From\\s+"
                with: ""
      Height:
        selector: //p[contains(@class,"text-D1D0CF")][contains(text(),"cm")]/text()
        postProcess:
          - replace:
              - regex: ".*?(\\d+)\\s*cm.*"
                with: "$1"
      Weight:
        selector: //p[contains(@class,"text-D1D0CF")][contains(text(),"kg")]/text()
        postProcess:
          - replace:
              - regex: ".*?(\\d+)\\s*kg.*"
                with: "$1"
      Image:
        # Fixed 2026-10-10: was //meta[@property="og:image"]/@href which can
        # never match (<meta> carries the URL in @content, not @href).
        selector: //meta[@property="og:image"]/@content
      URLs:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: "^/"
                with: "https://gayerdar.com/"
              - regex: "(?i)gayerdar\\.com/(?:en-us|zh-tw)?/?models/"
                with: "gayerdar.com/zh-TW/models/"

driver:
  useCDP: true

# Last Updated: 2026-10-10
