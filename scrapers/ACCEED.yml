# ACCEED (acceed.jp) — public CDP version.
# Verification status:
#   searchScraper: VERIFIED 2026-09-06 against https://acceed.jp/search.php?s=ACST
#     - cards: div.item_img; title: h6.overflow > a; link: a[href^='/detail.']
#   sceneScraper: REWRITTEN 2026-10-06 against live rendered DOM (logged in),
#     detail.ACSM344_1.html + detail.ACSM051.html:
#     - title: div#content4 > div.title > blockquote > h2
#     - cover: div.show > a.jacket1/@href ({CODE}_l.jpg)
#     - spec: ul.thongso > li > div.trai + div.phai; code in hidden
#       input[name=product_code]; NO canonical on detail pages
#     - one ul.select with li.cf section headers
#       (シリーズ/出演モデル/モデルタイプ/プレイ内容/…)
# Search URL: https://acceed.jp/search.php?s={keyword}
# Expected fields: Title, Date, Image, Code, URL, Tags, Details, Studio, Performer
# Last Updated: 2026-10-06

name: ACCEED

sceneByURL:
  - action: scrapeXPath
    url:
      - "acceed.jp/detail."
      - "www.acceed.jp/detail."
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://acceed.jp/search.php?s={}"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

# 2026-10-10: removed sceneByFragment. Its queryURL "{url}" only expands
# when the scene already stores a URL; scraping a URL-less scene passed the
# literal "{url}" to CDP (Cannot navigate to invalid URL), and the zero-row
# fragment result triggered the upstream Stash nil-pointer panic in
# processSceneRelationships (same as KOShop 2026-10-05). Use sceneByURL,
# or sceneByName → sceneByQueryFragment, instead.

xPathScrapers:
  searchScraper:
    common:
      $results: "//div[contains(concat(' ',normalize-space(@class),' '),' item_img ')][.//a[contains(@href,'/detail.')]]"

    scene:
      Title:
        selector: "$results//h6[contains(@class,'overflow')]//a[1]"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""

      Code:
        selector: "$results//h6[contains(@class,'overflow')]//a[1]/@href"
        postProcess:
          - replace:
              - regex: "^.*?/detail\\.([A-Za-z0-9]+)\\.html.*$"
                with: "$1"

      URLs:
        selector: "$results//h6[contains(@class,'overflow')]//a[1]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://acceed.jp" + v;
              return "https://acceed.jp/" + v;

      Image:
        selector: "$results//img[contains(@src,'pic_base/product')]/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://acceed.jp" + v;
              return "https://acceed.jp/" + v;

      Tags:
        Name:
          selector: "$results//div[contains(@class,'index-label')]//a[contains(@href,'search.php?c=')][not(contains(@href,'model=on'))]//span"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

      Performers:
        Name:
          selector: "$results//div[contains(@class,'index-label')]//a[contains(@href,'model=on')]"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

  sceneScraper:
    # Live DOM verified 2026-10-06 (logged in) against
    # detail.ACSM344_1.html and detail.ACSM051.html:
    # - title: main > div#content4 > div.title > blockquote > h2
    # - cover: div.show > a.jacket1/@href ({CODE}_l.jpg)
    # - spec table: ul.thongso > li > div.trai (label) + div.phai (value);
    #   hidden input[name=product_code] inside the cart form
    # - categories: ONE ul.select, sections split by li.cf headers
    #   (シリーズ / 出演モデル / モデルタイプ / プレイ内容 / …)
    # - NO link[rel=canonical] on detail pages
    # - series (Studio) absent on some pages (e.g. ACSM344)
    common:
      $spec: "//ul[contains(@class,'thongso')]"
      $cats: "//ul[contains(@class,'select')]"
    scene:
      Title:
        # h2 embeds the favorite-button span (with text) — take the first
        # text node only.
        selector: //div[@id='content4']//blockquote/h2/text()[normalize-space()][1]
        postProcess:
          - replace:
              - regex: "\\s{2,}"
                with: " "
              - regex: "^\\s+|\\s+$"
                with: ""

      Code:
        selector: "$spec//input[@name='product_code']/@value"
        postProcess:
          - replace:
              - regex: "^\\s+|\\s+$"
                with: ""

      URLs:
        fixed: "{inputURL}"

      Date:
        # Streaming items use 配信開始 instead of DVD発売 — match both.
        # Verified 2026-10-08 via logged-in walkthrough (3 detail pages).
        selector: "$spec//li[div[contains(@class,'trai')][contains(.,'発売') or contains(.,'配信')]]/div[contains(@class,'phai')]/text()"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              var m = v.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
              if (!m) m = v.match(/(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})/);
              if (!m) return "";
              var mm = ("0" + m[2]).slice(-2);
              var dd = ("0" + m[3]).slice(-2);
              return m[1] + "-" + mm + "-" + dd;
          - parseDate: "2006-01-02"

      Details:
        # Blurb sits right after ul.select ends as bare text nodes (DVD
        # template) or inside div.chitiet > p (streaming template).
        # Verified 2026-10-08 round 2 (4 detail pages, logged-in).
        selector: "$cats/following-sibling::p//text()[normalize-space()] | $cats/following-sibling::text()[normalize-space()] | //div[contains(@class,'chitiet')]//text()[normalize-space()]"
        concat: "\n\n"
        postProcess:
          - javascript: |
              var v = value || "";
              v = v.replace(/\r\n/g, "\n");
              v = v.replace(/[ \t]+\n/g, "\n");
              v = v.replace(/\n{3,}/g, "\n\n").trim();
              var seen = {}, out = [];
              v.split(/\n\n+/).forEach(function (p) {
                var k = p.trim();
                if (k && !seen[k]) { seen[k] = 1; out.push(k); }
              });
              return out.join("\n\n");

      Image:
        selector: "//div[contains(@class,'show')]//a[contains(@class,'jacket1')]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^\.\//, "https://acceed.jp/");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://acceed.jp" + v;
              return "https://acceed.jp/" + v;

      Studio:
        Name:
          selector: "$spec//li[div[contains(@class,'trai')][normalize-space()='シリーズ']]/div[contains(@class,'phai')]/text()"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

      Tags:
        Name:
          # Skip the シリーズ section (that's Studio, not a tag).
          selector: "$cats/li[not(contains(@class,'cf'))][not(preceding-sibling::li[contains(@class,'cf')][1]/a[@title='シリーズ'])]//a[contains(@href,'search.php?c=') and not(contains(@href,'model=on'))]/text()"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

      Performers:
        Name:
          selector: "$cats//a[contains(@href,'search.php?model=on')]/text()"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""
        URL:
          selector: "$cats//a[contains(@href,'search.php?model=on')]/@href"
          postProcess:
            - replace:
                - regex: "^/"
                  with: "https://acceed.jp/"

