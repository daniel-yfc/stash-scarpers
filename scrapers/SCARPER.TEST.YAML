# scrapers/RGBEE.test.yaml
# 測試設定檔：與 scrapers/RGBEE.yml 配套

# ============================================================
# 1. 場景 URL（選填）
# ============================================================
# 若提供，將直接測試這些 URL（跳過搜尋階段）
# 可為單一 URL 字串或 URL 陣列
# 若為陣列，將自動啟用 multi 模式

# 範例 A：單一 URL
url: https://example.com/movie/12345

# 範例 B：多個 URL（自動啟用 multi）
# url:
#   - https://example.com/movie/12345
#   - https://example.com/movie/67890

# ============================================================
# 2. 搜尋關鍵字（選填）
# ============================================================
# 若未提供 URL，將使用這些關鍵字進行搜尋測試
# 可為單一關鍵字或關鍵字陣列
# 若為陣列，將自動測試所有關鍵字

# 範例 A：單一關鍵字
probe: "DVD"

# 範例 B：多個關鍵字
# probe:
#   - DVD
#   - "2026"
#   - sample

# ============================================================
# 3. Cookie（選填）
# ============================================================
# 支援兩種格式：
# A) 簡單 Cookie header 字串
# B) Netscape Cookie File 格式（多行，自動辨識）

# 範例 A：簡單 Cookie header
# Cookie placement (comment only): PHPSESSID=<LOCAL_ONLY_VALUE>; never commit a live session value

# 範例 B：Netscape Cookie File 格式（使用 YAML | 語法保留換行）
# 絕不可將瀏覽器匯出的 Cookie 或 Session 實值貼入此 Git 追蹤檔案
# Cookie 值僅在 Git 工作樹以外的受控部署環境使用，這裡只保留位置示例：
# cookie: |
#   .example.invalid  FALSE  /  FALSE  0  SESSIONID  <LOCAL_ONLY_VALUE>

# ============================================================
# 4. 進階選項（選填，通常不需要）
# ============================================================

# 是否遍歷搜尋結果的多個頁面（預設：false）
# paginate: false

# 是否測試多個場景 URL（預設：自動偵測）
# - 若 url 為陣列，自動設為 true
# - 若 probe 為陣列，自動設為 true
# multi: auto

# 是否執行 searchScraper 測試（預設：true）
# - 預設永遠測試搜尋頁面
# - 只有明確設為 false 才停用
# search: true
