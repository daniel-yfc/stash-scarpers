# yaml-language-server: $schema=../validator/scraper.schema.json
# fc2 (adult.contents.fc2.com) — FC2 adult contents marketplace.
# Verification status (2026-10-02, anonymous fetch):
#   Site reachable: https://adult.contents.fc2.com/ responds (live marketplace).
#   Selectors UNVERIFIED — no live detail-page verification recorded for
#   sceneScraper or movieScraper. Verify against a live /article/ page
#   before relying on them.
# Last Updated: 2026-10-02

name: fc2

sceneByURL:
  - action: scrapeXPath
    url:
      - https://adult.contents.fc2.com/article/
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: https://adult.contents.fc2.com/article/{filename}/
  queryURLReplace:
    filename:
      - regex: .*?(\d{5,}).*
        with: $1
  scraper: sceneScraper

groupByURL:
  - action: scrapeXPath
    url:
      - https://adult.contents.fc2.com/article/
    scraper: movieScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' items_article_headerInfo ')]/h3/text()
        concat: ""

      Details:
        selector: //iframe[@data-iframe='description']/@src
        postProcess:
          - replace:
              - regex: '^/'
                with: https://adult.contents.fc2.com
          - subScraper:
              selector: //body//text()[not(ancestor::script) and not(ancestor::style)][normalize-space()]
              concat: "\n"

      URLs:
        selector: /html/head/meta[@property='og:url']/@content

      Date:
        selector: //*[@id='top']/div[1]/section[1]/div/section/div[2]/div[2]/p/text()
        postProcess:
          - replace:
              - regex: .*(\d{4})[./-]?(\d{1,2})[./-]?(\d{1,2}).*
                with: $1-$2-$3
          - parseDate: 2006-01-02

      Duration:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' items_article_MainitemThumb ')]//p[contains(concat(' ', normalize-space(@class), ' '), ' items_article_info ')]/text()

      Tags:
        Name:
          selector: //a[contains(concat(concat(' ', normalize-space(@class)), ' '), ' tagTag ')]/text()

      Image:
        selector: //section[contains(concat(' ', normalize-space(@class), ' '), ' items_article_SampleImages ')]//li[1]/a/@href
        postProcess:
          - replace:
              - regex: ^//
                with: https://

      Studio:
        Name:
          selector: //section[contains(concat(' ', normalize-space(@class), ' '), ' items_comment_sellerBox ')]//h4/a/text()

      Code:
        selector: //meta[@name='description']/@content
        postProcess:
          - replace:
              - regex: (?s).*?(FC2-PPV-\d+).*
                with: $1

  movieScraper:
    group:
      Name:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' items_article_headerInfo ')]/h3/text()
        concat: ""

      Synopsis:
        selector: //iframe[@data-iframe='description']/@src
        postProcess:
          - replace:
              - regex: '^/'
                with: https://adult.contents.fc2.com
          - subScraper:
              selector: //body//text()[not(ancestor::script) and not(ancestor::style)][normalize-space()]
              concat: "\n"

      URLs:
        selector: /html/head/meta[@property='og:url']/@content

      Date:
        selector: //*[@id='top']/div[1]/section[1]/div/section/div[2]/div[2]/p/text()
        postProcess:
          - replace:
              - regex: .*(\d{4})[./-]?(\d{1,2})[./-]?(\d{1,2}).*
                with: $1-$2-$3
          - parseDate: 2006-01-02

      Duration:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' items_article_MainitemThumb ')]//p[contains(concat(' ', normalize-space(@class), ' '), ' items_article_info ')]/text()

      FrontImage:
        selector: //section[contains(concat(' ', normalize-space(@class), ' '), ' items_article_SampleImages ')]//li[1]/a/@href
        postProcess:
          - replace:
              - regex: ^//
                with: https://

      Studio:
        Name:
          selector: //section[contains(concat(' ', normalize-space(@class), ' '), ' items_comment_sellerBox ')]//h4/a/text()

      Tags:
        Name:
          selector: //a[contains(concat(concat(' ', normalize-space(@class)), ' '), ' tagTag ')]/text()
