name: KO-Tube
sceneByURL:
- action: scrapeXPath
  url:
  - ko-tube.com/package/index/
  - ko-tube.com/product/index/
  - ko-tube.com/product/index2/
  scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.ko-tube.com/search/index?kw={}&sk=0
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: '{url}'
  scraper: sceneScraper
groupByURL:
- action: scrapeXPath
  url:
  - ko-tube.com/package/index/
  scraper: groupScraper
xPathScrapers:
  sceneSearch:
    common:
      $item: //a[contains(@href, "/product/index") or contains(@href, "/package/index/")]
    scene:
      Title: $item
      Image: $item//img/@src
      URLs: $item/@href
  sceneScraper:
    scene:
      # Live DOM verified 2026-10-06 against package page 28444 and
      # single-product page 95976:
      # - title is a classless h3 inside div#Contents (not h1.title)
      # - spec table labels are <th>, values are sibling <td> (not td/td)
      # - description: div.sub_data > p (package) / div.intro_text > p (single)
      Title:
        selector: //div[@id='Contents']//h3[1]/text()
        postProcess:
        - replace:
          - regex: ^\s+|\s+$
            with: ''
      Code:
        selector: //th[contains(text(), "作品番号")]/following-sibling::td[1]/text()
        postProcess:
        - replace:
          - regex: ^\s+|\s+$
            with: ''
      Date:
        selector: //th[contains(text(), "DVD 発売") or contains(text(), "発売")]/following-sibling::td[1]/text()
        postProcess:
        - replace:
          - regex: (\d{4})\.(\d{1,2})\.(\d{1,2})
            with: $1-$2-$3
        - replace:
          - regex: ([0-9]{4}) 年 ([0-9]{1,2}) 月
            with: $1-$2-01
        - javascript: "var p = value.split(\"-\");\nif (p.length >= 2) {\n  return p[0] + \"-\" + (\"0\" + p[1]).slice(-2) + \"-\" + (p[2] ? (\"0\" + p[2]).slice(-2) : \"01\");\n}\nreturn value;\n"
        - parseDate: '2006-01-02'
      Details:
        selector: //div[contains(concat(' ',normalize-space(@class),' '),' sub_data ')]/p//text()[normalize-space()] | //div[contains(concat(' ',normalize-space(@class),' '),' intro_text ')]/p//text()[normalize-space()]
        concat: "\n\n"
      Image: //img[contains(@src, "/picture/parent/") and contains(@src, "_3.jpg")]/@src | //img[contains(@src, "/picture/")]/@src
      Studio:
        Name:
          selector: //th[contains(text(), "レーベル")]/following-sibling::td[1]/text()
          postProcess:
          - replace:
            - regex: ^\s+|\s+$
              with: ''
      Tags:
        Name:
          selector: //th[contains(text(), "プレイ")]/following-sibling::td[1]/text()
          postProcess:
          - replace:
            - regex: ^\s+|\s+$
              with: ''
          split: 、
      Performers:
        Name:
          # Live DOM (2026-10-06): single-product pages use the spec-table
          # th[モデル] row; package pages list performers in a standalone
          # 出演モデル block as a[href^='/search/index?ml='] + h6 pairs.
          selector: //th[contains(text(), "モデル")]/following-sibling::td[1]/text() | //a[starts-with(@href,'/search/index?ml=')]/following-sibling::h6[1]/text()
          postProcess:
          - replace:
            - regex: ^\s+|\s+$
              with: ''
          split: 、
      # Panic guard (2026-10-07): fixed URLs guarantees scrapeScene never
      # returns zero results — Stash nil-panics on empty results
      # (pkg/scraper/mapped.go processSceneRelationships).
      URLs:
        fixed: "{inputURL}"
      Groups:
        Name: //div[@id='Contents']//h3[1]/text()
  groupScraper:
    group:
      Name: //div[@id='Contents']//h3[1]/text()
      Date:
        selector: //th[contains(text(), "DVD 発売") or contains(text(), "発売")]/following-sibling::td[1]/text()
        postProcess:
        - replace:
          - regex: (\d{4})\.(\d{1,2})\.(\d{1,2})
            with: $1-$2-$3
        - replace:
          - regex: ([0-9]{4}) 年 ([0-9]{1,2}) 月
            with: $1-$2-01
        - javascript: "var p = value.split(\"-\");\nif (p.length >= 2) {\n  return p[0] + \"-\" + (\"0\" + p[1]).slice(-2) + \"-\" + (p[2] ? (\"0\" + p[2]).slice(-2) : \"01\");\n}\nreturn value;\n"
        - parseDate: '2006-01-02'
      Synopsis:
        selector: //div[contains(concat(' ',normalize-space(@class),' '),' sub_data ')]/p//text()[normalize-space()] | //div[contains(concat(' ',normalize-space(@class),' '),' intro_text ')]/p//text()[normalize-space()]
        concat: "\n\n"
      FrontImage: //img[contains(@src, "/picture/parent/") and contains(@src, "_3.jpg")]/@src | //img[contains(@src, "/picture/")]/@src
      Studio:
        Name:
          selector: //th[contains(text(), "レーベル")]/following-sibling::td[1]/text()
          postProcess:
          - replace:
            - regex: ^\s+|\s+$
              with: ''
      Tags:
        Name:
          selector: //th[contains(text(), "プレイ")]/following-sibling::td[1]/text()
          postProcess:
          - replace:
            - regex: ^\s+|\s+$
              with: ''
          split: 、
      URLs: //a[contains(@href, "ko-video.com")]/@href
# Last Updated: 2026-10-06 — scene/group selectors rewritten against live DOM
# (h3 title, th/td spec table, sub_data/intro_text description).
driver:
  useCDP: true
  headers:
  - Key: User-Agent
    Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
