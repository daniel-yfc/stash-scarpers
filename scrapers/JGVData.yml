# JGVData
# 2026-10-06: scrutiny.js 8/8 scene + 2/2 search passed; 3 detail pages
# re-verified healthy; search probes (KEN / HBM-954 / 本番解禁) all HIT.
# NOTE: use https://www.jgvdata.com/ (bare domain redirects to ad parking).
# Last Updated: 2026-10-10
# Validator fixes:
#   - sceneByURL regex -> simple prefix (url items are plain strings)
#   - {query} -> {} (Stash sceneByName only substitutes the {} placeholder)
#   - replaced invalid `trim` postProcess with replace-regex trim

name: JGVData

sceneByURL:
  - action: scrapeXPath
    url:
      - jgvdata.com/
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://jgvdata.com/?s={}"
  scraper: searchScraper

# Identify disabled: this entry returned a keyword-results page as one scene.
# Use sceneByName and select a result for sceneByQueryFragment instead.
# See docs/metadata-feed-integration.md (2026-10-10).

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//article[contains(concat(' ', normalize-space(@class), ' '), ' mg-posts-sec-post ')]"
    scene:
      Title:
        selector: "$results//h4[contains(concat(' ', normalize-space(@class), ' '), ' title ')]//a/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      URLs:
        selector: "$results//a[contains(concat(' ', normalize-space(@class), ' '), ' link-div ')]/@href"

  sceneScraper:
    common:
      $main: "(//div[contains(concat(' ', normalize-space(@class), ' '), ' mg-blog-post-box ')])[1]"
    scene:
      Title:
        selector: "$main//h1[contains(concat(' ', normalize-space(@class), ' '), ' title ')]/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Code:
        selector: "$main//dt[normalize-space()='GV Code']/following-sibling::dd[1]/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Date:
        selector: "$main//dt[normalize-space()='Release Date']/following-sibling::dd[1]/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
          - parseDate: "2006-01-02"
      Details:
        selector: "$main//dt[normalize-space()='Context:']/following-sibling::dd[1]"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Image:
        selector: "$main//img[contains(concat(' ', normalize-space(@class), ' '), ' wp-post-image ')]/@src"
      Studio:
        Name:
          selector: "$main//div[contains(concat(' ', normalize-space(@class), ' '), ' mg-blog-category ')]//a/text()"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
      Tags:
        Name:
          selector: "$main//dt[normalize-space()='Label']/following-sibling::dd[1]//a/text()"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
      URLs:
        selector: "//link[@rel='canonical']/@href | //meta[@property='og:url']/@content"
