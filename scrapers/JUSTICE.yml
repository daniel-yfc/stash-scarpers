# Justice01 (justice01.com) — WordPress/Cocoon blog + EC-CUBE shop.
# Public version: driver.useCDP: true; no driver.cookies.
# IMPORTANT: the site moved from justice01.jp (dead, DNS no longer resolves)
# to justice01.com. All URLs below target the live .com domain.
#
# Verification status (2026-09-06, anonymous fetch of live pages):
#   VERIFIED against https://www.justice01.com/justice175th/ (detail) and
#   https://www.justice01.com/?s=JUSTICE (search):
#   - detail is a WordPress post: h1.entry-title, time.entry-date[datetime],
#     figure.eye-catch (data-src thumb), slider div.sp-image[data-src] covers,
#     div.entry-content paragraphs, footer div.entry-categories a.cat-link.
#     No studio/maker, performers, code, or 発売日 fields exist on the page.
#   - search cards: a.entry-card-wrap > article.entry-card
#     (h2.entry-card-title, thumb img[data-src], title attr on the wrapper).
#   - work slugs are /justice…th/ and /guilty…th/ (series JUSTICE/GUILTY);
#     新発売 variant URLs also exist (…th新発売/) and are excluded via the
#     slug prefixes below.
# No age gate observed; HTTP fetches return 200 without cookies. CDP is kept
# only as a safety net for future gating.
#
# Field rules (source language, not translated):
#   Title    h1.entry-title as-is (e.g. JUSTICE17(5th))
#   Date     time.entry-date @datetime (ISO, includes +09:00 offset)
#   Image    eye-catch data-src (animated GIF cover); slider A.jpg as fallback
#   Details  entry-content <p> text (contains price/notes lines)
#   Tags     footer cat-link labels (JUSTICE5th, ゲイDVD, …)
#   Studio/Performers/Code: not present on live pages — omitted intentionally.
# 2026-10-06: Image gained @src fallback (first slider img lacks data-src on
# some pages), verified against live DOM.
# 2026-11-14 (finetune): titles are normalised by a Title replace chain
# in both the detail and search scrapers, for an ALLOWLIST of series
# names only — JUSTICE, GUILTY, TOKUTEN, JUSTICE裏 (user ruling; other
# labels on this site, e.g. PENALTY / PORNO / COMBAT, are deliberately
# NOT normalised, and new series must not be added without a ruling).
# Grammar: series + number/ordinal in either order (ordinal with or
# without parentheses) becomes "SERIES (Nth) NN"; a bare number becomes
# "SERIES NN"; digits verbatim (01 stays 01). BEST compilations:
# "SERIES [Nth ]BESTn +N" — the ordinal may sit adjacent to the series
# (JUSTICE3rd BEST2+1) or as a trailing parenthesis (JUSTICE
# BEST2+1(4th)); both move behind the series, parenthesised; BEST may
# be bare and may touch the series (TOKUTENBEST+1); the trailing +N is
# always spaced ("BEST2 +1"). Only fully-anchored matches are touched;
# info posts and announcements pass through byte-identical.
# Last Updated: 2026-11-14

name: JUSTICE

sceneByURL:
  - action: scrapeXPath
    url:
      - "justice01.com/guilty"
      - "justice01.com/justice"
      - "www.justice01.com/guilty"
      - "www.justice01.com/justice"
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.justice01.com/?s={}"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

# Identify disabled: this entry returned a keyword-results page as one scene.
# Use sceneByName and select a result for sceneByQueryFragment instead.
# See docs/metadata-feed-integration.md (2026-10-10).

xPathScrapers:
  searchScraper:
    common:
      $card: "//a[contains(concat(' ',normalize-space(@class),' '),' entry-card-wrap ')][./article[contains(@class,'entry-card')]]"

    scene:
      Title:
        selector: "$card//h2[contains(@class,'entry-card-title')][1]"
        postProcess:
          - replace:
              - regex: "新発売$|フェア$"
                with: ""
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)(\\d+(?:st|nd|rd|th))\\s*BEST(\\d*)\\+(\\d+)$"
                with: "$1 ($2) BEST$3 +$4"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)\\s*BEST(\\d*)\\+(\\d+)\\((\\d+(?:st|nd|rd|th))\\)$"
                with: "$1 ($4) BEST$2 +$3"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)\\s*BEST(\\d*)\\+(\\d+)$"
                with: "$1 BEST$2 +$3"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)(\\d+)\\((\\d+(?:st|nd|rd|th))\\)$"
                with: "$1 ($3) $2"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)\\((\\d+(?:st|nd|rd|th))\\)(\\d+)$"
                with: "$1 ($2) $3"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)(\\d+(?:st|nd|rd|th))(\\d+)$"
                with: "$1 ($2) $3"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)(\\d+)$"
                with: "$1 $2"
              - regex: "^\\s+|\\s+$"
                with: ""

      Code:
        selector: "$card//article/@class"
        postProcess:
          - replace:
              - regex: "^.*post-(\\d+).*$"
                with: "$1"

      URLs:
        selector: "$card/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (/^https?:/i.test(v)) return v;
              v = v.replace(/^\.\/+/, "");
              if (v.charAt(0) === "/") return "https://www.justice01.com" + v;
              return "https://www.justice01.com/" + v;

      Image:
        selector: "$card//figure[contains(@class,'entry-card-thumb')]//img/@data-src | $card//figure[contains(@class,'entry-card-thumb')]//img/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v || v.indexOf("data:image") === 0) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (/^https?:/i.test(v)) return v;
              v = v.replace(/^\.\/+/, "");
              if (v.charAt(0) === "/") return "https://www.justice01.com" + v;
              return "https://www.justice01.com/" + v;
              return v;

  sceneScraper:
    common:
      # 2026-11-14 (finetune): the h1 predicate also excludes the Cocoon
      # 404 template. A nonexistent work URL returns HTTP 404 with a page
      # whose article.post + h1.entry-title read "404 NOT FOUND" and whose
      # canonical is /404/ — the unguarded selector scraped that into a
      # fake scene (Title "404 NOT FOUND", URL .../404/, theme screenshot
      # as Image). Live-verified on /justice999th/; real posts and the
      # committed fixtures are unaffected (their h1 is the work title).
      # 2026-11-14 (finetune, user ruling): the same fail-closed idea
      # excludes announcement posts. A 新発売 announcement is a separate
      # post from the work it announces (slug …th新発売/ next to the
      # plain work slug; 24 such posts in the sitemap) and was claimed
      # by sceneByURL, returning a stub (Title "JUSTICE16(5th)新発売",
      # theme screenshot as Image, 44 chars of Details). An article is
      # an announcement only when BOTH signals hold — its h1 contains
      # 新発売 AND it is filed under the 新着情報 (whats-new) category;
      # work posts carry a series category and a bare work h1, so the
      # conjunction cannot misfire on them (all saved work pages
      # checked). Document-level selectors (URLs, the eye-catch /
      # og:image branches, Groups) repeat the same test in absolute
      # form, mirroring the 404 guard.
      $article: "//article[contains(@class,'post')][.//h1[contains(@class,'entry-title')][not(normalize-space(.)='404 NOT FOUND')]][not(.//h1[contains(@class,'entry-title')][contains(normalize-space(.),'新発売')] and .//div[contains(@class,'entry-categories')]//a[contains(@class,'cat-link')][normalize-space(.)='新着情報'])]"

    scene:
      Title:
        selector: "$article//h1[contains(@class,'entry-title')]/text()"
        postProcess:
          - replace:
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)(\\d+(?:st|nd|rd|th))\\s*BEST(\\d*)\\+(\\d+)$"
                with: "$1 ($2) BEST$3 +$4"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)\\s*BEST(\\d*)\\+(\\d+)\\((\\d+(?:st|nd|rd|th))\\)$"
                with: "$1 ($4) BEST$2 +$3"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)\\s*BEST(\\d*)\\+(\\d+)$"
                with: "$1 BEST$2 +$3"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)(\\d+)\\((\\d+(?:st|nd|rd|th))\\)$"
                with: "$1 ($3) $2"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)\\((\\d+(?:st|nd|rd|th))\\)(\\d+)$"
                with: "$1 ($2) $3"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)(\\d+(?:st|nd|rd|th))(\\d+)$"
                with: "$1 ($2) $3"
              - regex: "^(JUSTICE裏|JUSTICE|GUILTY|TOKUTEN)(\\d+)$"
                with: "$1 $2"
              - regex: "^\\s+|\\s+$"
                with: ""

      URLs:
        # STASH-E2E-05: canonical is primary; og:url is a fallback only
        # when canonical is absent. The old union + concat:"\n" merged
        # both (usually identical) URLs into one newline-joined duplicate
        # string. Parenthesised branches with a not(canonical) guard on
        # the fallback emit exactly one URL (same pattern as the
        # CK-Download Studio label/maker guard).
        # Stabilization: the guard tests for a canonical whose href is
        # non-empty after normalize-space. An empty/whitespace-only
        # canonical href previously still counted as "present", emitted
        # a single empty URL value and suppressed the valid og:url
        # fallback; it now falls back like an absent canonical. A
        # non-empty but malformed canonical still wins — XPath cannot
        # validate URL syntax, and no such page is in the evidence.
        # 2026-11-14 (finetune): both branches also carry the 404 guard
        # (see $article above) — canonical/og:url live in <head> and
        # cannot be scoped under $article, so without it a 404 page
        # still emitted its /404/ URL here.
        selector: "(//link[@rel='canonical'][normalize-space(@href)][not(//h1[contains(@class,'entry-title')][normalize-space(.)='404 NOT FOUND'])][not((//h1[contains(@class,'entry-title')][contains(normalize-space(.),'新発売')]) and (//div[contains(@class,'entry-categories')]//a[contains(@class,'cat-link')][normalize-space(.)='新着情報']))]/@href)[1] | (//meta[@property='og:url'][not(//h1[contains(@class,'entry-title')][normalize-space(.)='404 NOT FOUND'])][not((//h1[contains(@class,'entry-title')][contains(normalize-space(.),'新発売')]) and (//div[contains(@class,'entry-categories')]//a[contains(@class,'cat-link')][normalize-space(.)='新着情報']))]/@content)[1][not(//link[@rel='canonical'][normalize-space(@href)]/@href)]"

      Details:
        selector: "$article//div[contains(@class,'entry-content')]//p//text()[normalize-space()]"
        concat: "\n"
        postProcess:
          # 2026-11-14 (finetune, user ruling): two-stage boilerplate cut,
          # applied literally in this order — (1) if the text contains
          # 特典映像, drop everything from its first occurrence (bonus
          # contents, runtime, price/quantity, sold-out notices, set
          # promos); (2) only when there is no 特典映像 at all, drop
          # everything from the first 価格 (the EC price block).
          # Exception (user ruling 2026-11-14): the fallback does not
          # apply when the price block opens the text — on justice03
          # and porno the EC block is the first thing in the entry, so
          # cutting there would empty the Details entirely; those pages
          # keep their full text. The main 特典映像 rule is unaffected.
          # The conditional cannot be expressed with replace steps (RE2
          # has no lookahead), so the cut lives in this javascript step
          # ahead of the whitespace cleanup; the tail it leaves is
          # trimmed below.
          - javascript: |
              var v = value || "";
              var bonusAt = v.indexOf("特典映像");
              if (bonusAt >= 0) {
                v = v.substring(0, bonusAt);
              } else {
                var priceAt = v.indexOf("価格");
                if (priceAt >= 0 && v.substring(0, priceAt).trim() !== "") {
                  v = v.substring(0, priceAt);
                }
              }
              v = v.replace(/\r\n/g, "\n");
              v = v.replace(/[ \t]+\n/g, "\n");
              v = v.replace(/\n{3,}/g, "\n\n");
              return v.replace(/^\s+|\s+$/g, "");

      Image:
        # Live DOM (2026-10-06): first slider img sometimes lacks data-src;
        # fall back to @src, then eye-catch, then og:image.
        # 2026-11-14 (finetune): the @src fallback branch also excludes
        # 'blank.gif' — in the served HTML every slider img carries the
        # plugin's blank.gif lazy-load placeholder as @src, so the branch
        # emitted that placeholder as a scene image on every page, and as
        # the ONLY image on pages whose slider cover is the no-image
        # placeholder (justice03, porno). The rendered-DOM fallback the
        # branch exists for (a real @src once the slider has loaded) is
        # unaffected.
        selector: "$article//div[contains(@class,'sp-slides')]//img[contains(@class,'sp-image')][not(contains(@data-src,'no-image'))][1]/@data-src | $article//div[contains(@class,'sp-slides')]//img[contains(@class,'sp-image')][not(contains(@src,'no-image'))][not(contains(@src,'blank.gif'))][1]/@src | //figure[contains(@class,'eye-catch')][not(//h1[contains(@class,'entry-title')][normalize-space(.)='404 NOT FOUND'])][not((//h1[contains(@class,'entry-title')][contains(normalize-space(.),'新発売')]) and (//div[contains(@class,'entry-categories')]//a[contains(@class,'cat-link')][normalize-space(.)='新着情報']))]//img[not(contains(@data-src,'.gif'))]/@data-src | //meta[@property='og:image'][not(contains(@content,'.gif'))][not(//h1[contains(@class,'entry-title')][normalize-space(.)='404 NOT FOUND'])][not((//h1[contains(@class,'entry-title')][contains(normalize-space(.),'新発売')]) and (//div[contains(@class,'entry-categories')]//a[contains(@class,'cat-link')][normalize-space(.)='新着情報']))]/@content"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v || v.indexOf("data:image") === 0) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (/^https?:/i.test(v)) return v;
              v = v.replace(/^\.\/+/, "");
              if (v.charAt(0) === "/") return "https://www.justice01.com" + v;
              return "https://www.justice01.com/" + v;
              return v;

      Performers:
        Name:
          # Performer names in h3.wp-block-heading like 【ホクト】.
          # Verified 2026-10-17 on guilty2nd20.
          # 2026-11-14 (finetune): current-season (5th) pages head their
          # chapters "Act1：【REN】" instead of a bare 【NAME】, so the old
          # starts-with('【') predicate matched nothing there and those
          # pages returned no performers at all (live: justice115th,
          # justice155th, justice175th). The predicate now accepts a
          # bracketed name anywhere in the heading, the selector returns
          # the heading element (justice115th wraps the heading text in
          # <strong>, so /text() sees nothing), and the replace chain
          # extracts the FIRST bracketed token — text after the first 】
          # (chapter prose pasted inside the heading on some pages) is
          # cut. The Bonus Track / 【Type】 exclusions are unchanged in
          # effect (contains-based, so they also cover Act-prefixed
          # variants).
          # 2026-11-14 (finetune GT follow-up): product headings share
          # the same h3 shape on some pages — 【JUSTICE02(4th)単品】(A)/(B)
          # and the 『…』100パーセット bundle heading on justice4th02 —
          # and were scraped as performers. Performer chapter headings
          # are bare names, so headings containing 単品 (single-item
          # product) or セット (bundle) are excluded here.
          # 2026-11-15 (runtime fix): Gate B (GATEB-20261115) plus the
          # selector-variant diagnosis (lease GATEB-JUSTICE-DIAG-20261115)
          # proved that, without concat, the Stash runtime hands this
          # field only the FIRST matched heading node's value — pages
          # whose chapters are separate headings (justice115th/155th/
          # 175th) lost the Act2 performer live, while the offline
          # harness, which iterates every matched node, scored them
          # correct. Concat fields are joined BEFORE postProcess in the
          # runtime (Details above relies on exactly that and matched
          # its offline values byte-for-byte live), so the matched
          # headings are now concatenated into a single value and a
          # javascript step extracts the bracketed name tokens from the
          # joined text: both chapter names reach the field through the
          # one-string path that single-heading pages (justice20's ＆
          # pair) already took live, and split separates them. The
          # selector — and with it the node-level Bonus Track / 【Type】
          # / 単品 / セット exclusions — is unchanged; the javascript
          # step re-applies the same exclusions per token as a second
          # line of defence (a surviving heading's pasted prose can
          # carry further bracketed text), then applies the ＆ pair
          # split and the trailing-編 strip per token, in the same
          # order the old per-node replace chain did. The step is
          # idempotent — a value without 【 is already an extracted
          # name and passes through — because the offline harness
          # re-runs postProcess on split pieces.
          selector: "$article//h3[contains(@class,'wp-block-heading')][contains(normalize-space(.), '【')][not(contains(., 'Bonus Track'))][not(contains(normalize-space(.), '【Type'))][not(contains(., '単品'))][not(contains(., 'セット'))]"
          concat: "\n"
          split: "×"
          postProcess:
            - javascript: |
                var v = value || "";
                if (v.indexOf("【") === -1) return v;
                var names = [];
                var re = /【([^】]*)】/g;
                var m;
                while ((m = re.exec(v)) !== null) {
                  var token = m[1];
                  if (token.indexOf("Bonus Track") !== -1) continue;
                  if (token.indexOf("Type") === 0) continue;
                  if (token.indexOf("単品") !== -1 || token.indexOf("セット") !== -1) continue;
                  token = token.replace(/＆/g, "×").replace(/編$/, "").replace(/^\s+|\s+$/g, "");
                  if (token) names.push(token);
                }
                return names.join("×");
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""
        Gender:
          fixed: MALE
        Country:
          fixed: JP
        Ethnicity:
          fixed: Asian
      Groups:
        Name:
          # Series group from entry-categories, excluding the generic parent.
          # Verified 2026-10-17 on guilty2nd20 (GUILTY2nd).
          # 2026-11-14 (finetune): the announcement guard (see $article)
          # is repeated here in absolute form — this selector is not
          # scoped under $article, so without it an announcement post
          # still emitted its 新着情報 group.
          selector: "//div[contains(@class,'entry-categories')]//a[contains(@class,'cat-link')][not(normalize-space(.)='ゲイビデオ・DVD')][not((//h1[contains(@class,'entry-title')][contains(normalize-space(.),'新発売')]) and (//div[contains(@class,'entry-categories')]//a[contains(@class,'cat-link')][normalize-space(.)='新着情報']))]/text()"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""
        URLs:
          selector: "//div[contains(@class,'entry-categories')]//a[contains(@class,'cat-link')][not(normalize-space(.)='ゲイビデオ・DVD')][not((//h1[contains(@class,'entry-title')][contains(normalize-space(.),'新発売')]) and (//div[contains(@class,'entry-categories')]//a[contains(@class,'cat-link')][normalize-space(.)='新着情報']))]/@href"

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
