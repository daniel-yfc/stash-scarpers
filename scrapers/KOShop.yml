# KO Shop
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Search URL verified 2026-08-27: /products/list.php?word=雄穴
# → /products/detail.php?product_id=42743, 42707, 42727.
# Card XPath UNVERIFIED ($x not run on list markup).
# Detail selectors kept from product_id=40277 DOM.
# Studio = シリーズ, not メーカー. No Groups from シリーズ.
# 2026-10-05: removed sceneByFragment. Its queryURL "{url}" only expands
# when the scene already stores a URL; scraping a URL-less scene passed the
# literal "{url}" to CDP (Cannot navigate to invalid URL), and the zero-row
# fragment result triggered the upstream Stash nil-pointer panic in
# processSceneRelationships (see debugging.md). Use sceneByURL, or
# sceneByName → sceneByQueryFragment, instead.
# 2026-10-06: fixed Details class undercol → under_col and Tags headings
# (モデルタイプ / キーワード) against live DOM.
# Last Updated: 2026-10-06

name: KO Shop

sceneByURL:
  - action: scrapeXPath
    url:
      - ko-shop.com/products/detail.php
      - www.ko-shop.com/products/detail.php
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.ko-shop.com/products/list.php?word={}"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

# Same product URLs double as Group (package) pages — Stash picks the
# scraper by context (Scene vs Group). Verified 2026-10-07.
groupByURL:
  - action: scrapeXPath
    url:
      - ko-shop.com/products/detail.php
      - www.ko-shop.com/products/detail.php
    scraper: groupScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//a[contains(@href,'/products/detail.php?product_id=')][.//img][.//div[contains(@class,'list_title')]]"
    scene:
      Title:
        selector: "$results//div[contains(@class,'list_title')]//text()"
        concat: " "
        postProcess:
          - replace:
              - regex: '\\s{2,}'
                with: " "
              - regex: '^\s+|\s+$'
                with: ""
      URLs:
        selector: "$results/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.ko-shop.com" + v;
              return "https://www.ko-shop.com/" + v;
      Image:
        selector: "$results//img[1]/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.ko-shop.com" + v;
              return "https://www.ko-shop.com/" + v;

  sceneScraper:
    common:
      $meta: "//div[contains(concat(' ',normalize-space(@class),' '),' detail_product ')]//dl[1]"
    scene:
      Title:
        selector: "//div[contains(concat(' ',normalize-space(@class),' '),' detail_product ')]//h2[1] | //title"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Code:
        selector: "$meta/dt[normalize-space(.)='商品コード']/following-sibling::dd[1]"
        postProcess:
          - javascript: |
              var v = value || "";
              return v.replace(/^[\s:：]+|[\s\u00a0]+$/gu, "").trim();
      Details:
        # Description is direct text nodes of div.ma_b30 (with <br>), NOT a
        # following div — h2/following-sibling::div[1] never matches.
        # Use concat(' ',normalize-space(@class),' ') for class matching.
        # Verified 2026-10-08 round 2 (3 detail pages).
        selector: "//div[contains(concat(' ',normalize-space(@class),' '),' under_col ')]/div[contains(concat(' ',normalize-space(@class),' '),' ma_b30 ')][h2[contains(.,'商品説明')]]/text()[normalize-space()]"
        concat: "\n"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
              - regex: '\n{3,}'
                with: "\n\n"
              # Strip trailing shop boilerplate when present (2026-10-07).
              - regex: "\\s*商品説明\\s*オフィシャル購入で限定特典DISCが選べる!\\s*OFFICIALサイトへは↓画像のリンクから!\\s*$"
                with: ""
      URLs:
        fixed: "{inputURL}"
      Date:
        selector: "$meta/dt[normalize-space(.)='発売日']/following-sibling::dd[1]"
        postProcess:
          - javascript: |
              var v = (value || "").replace(/[\s\u00a0]/g, "");
              if (!v) return "";
              var m = v.match(/(\d{4})[年\/\-.]?(\d{1,2})[月\/\-.]?(\d{1,2})/);
              if (!m) m = v.match(/(\d{4})(\d{2})(\d{2})/);
              if (!m) return "";
              var mm = ("0" + m[2]).slice(-2);
              var dd = ("0" + m[3]).slice(-2);
              return m[1] + "-" + mm + "-" + dd;
          - parseDate: "2006-01-02"
      Image:
        selector: "//div[contains(concat(' ',normalize-space(@class),' '),' detail_main_img ')]//a[contains(@href,'upload/save_image/') or contains(@href,'uploadsaveimage')][1]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.ko-shop.com" + v;
              return "https://www.ko-shop.com/" + v;
      # Studio convention: label/brand-level field → Studio (sub-studio model,
      # StashDB amateur-studios).
      # Studio URLs mapped from the same anchor as Studio Name for Identify URL-matching.
      # Parent studio (platform/network) assigned manually once; Ignore Auto-Tag
      # recommended for short label names.
      Studio:
        Name:
          selector: "$meta/dt[normalize-space(.)='シリーズ']/following-sibling::dd[1]//a[1]"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
        URLs:
          selector: "$meta/dt[normalize-space(.)='シリーズ']/following-sibling::dd[1]//a[1]/@href"
          postProcess:
            - javascript: |
                var v = value || "";
                if (!v) return "";
                v = v.replace(/^\/\//, "https://");
                if (/^https?:/i.test(v)) return v;
                if (v.charAt(0) === "/") return "https://www.ko-shop.com" + v;
                return "https://www.ko-shop.com/" + v;
      Tags:
        Name:
          # Live DOM (2026-10-06): headings are モデルタイプ / キーワード
          # (カテゴリ / ジャンル do not exist on detail pages).
          selector: "$meta/dt[normalize-space(.)='モデルタイプ']/following-sibling::dd[1]//a | $meta/dt[normalize-space(.)='キーワード']/following-sibling::dd[1]//a"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
      # Performers: omitted (2026-10-10). KOShop detail pages carry no
      # structured performer field. The old CAST-line selector
      # ("CAST : 名1 | 名2 | ... ほか") matched nothing on 6/6 sampled
      # pages — the CAST line does not exist in current page templates.
      # JUSTICE performer names may appear in description/title text
      # (e.g. Act：【NAME】 on justice01, numbered lists on KOShop), but
      # formats vary by product and parsing them is unreliable.
      # For performer data, prefer the KOVideo scraper, which has a
      # dedicated 出演モデル field on all pages.

  # Group view of the same product page (2026-10-07):
  # - Code goes to Aliases, not Code
  # - Duration from 収録時間 (minutes → seconds)
  # - Image goes to FrontImage
  groupScraper:
    common:
      $meta: "//div[contains(concat(' ',normalize-space(@class),' '),' detail_product ')]//dl[1]"
    group:
      Name:
        selector: "//div[contains(concat(' ',normalize-space(@class),' '),' detail_product ')]//h2[1] | //title"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Aliases:
        selector: "$meta/dt[normalize-space(.)='商品コード']/following-sibling::dd[1]"
        postProcess:
          - javascript: |
              var v = value || "";
              return v.replace(/^[\s:：]+|[\s\u00a0]+$/gu, "").trim();
      Duration:
        selector: "$meta/dt[normalize-space(.)='収録時間']/following-sibling::dd[1]"
        postProcess:
          - javascript: |
              var v = (value || "").replace(/[\s\u00a0:：]/g, "");
              // "107分" -> 6420, "1時間47分" -> 6420
              var m = v.match(/(?:(\d+)時間)?(?:(\d+)分)?/);
              if (!m || (!m[1] && !m[2])) return "";
              var mins = (parseInt(m[1] || "0", 10) * 60) + parseInt(m[2] || "0", 10);
              if (!mins) return "";
              return String(mins * 60);
      FrontImage:
        selector: "//div[contains(concat(' ',normalize-space(@class),' '),' detail_main_img ')]//a[contains(@href,'upload/save_image/') or contains(@href,'uploadsaveimage')][1]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.ko-shop.com" + v;
              return "https://www.ko-shop.com/" + v;
      Date:
        selector: "$meta/dt[normalize-space(.)='発売日']/following-sibling::dd[1]"
        postProcess:
          - javascript: |
              var v = (value || "").replace(/[\s\u00a0]/g, "");
              if (!v) return "";
              var m = v.match(/(\d{4})[年\/\-. ]?(\d{1,2})[月\/\-. ]?(\d{1,2})/);
              if (!m) m = v.match(/(\d{4})(\d{2})(\d{2})/);
              if (!m) return "";
              var mm = ("0" + m[2]).slice(-2);
              var dd = ("0" + m[3]).slice(-2);
              return m[1] + "-" + mm + "-" + dd;
          - parseDate: "2006-01-02"
      Synopsis:
        selector: "//div[contains(concat(' ',normalize-space(@class),' '),' under_col ')]/div[contains(concat(' ',normalize-space(@class),' '),' ma_b30 ')][1]//text()[normalize-space()][not(parent::h2)]"
        concat: "\n"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
              - regex: '\n{3,}'
                with: "\n\n"
              - regex: "\\s*商品説明\\s*オフィシャル購入で限定特典DISCが選べる!\\s*OFFICIALサイトへは↓画像のリンクから!\\s*$"
                with: ""
      # Studio convention: label/brand-level field → Studio (sub-studio model,
      # StashDB amateur-studios).
      # Studio URLs mapped from the same anchor as Studio Name for Identify URL-matching.
      # Parent studio (platform/network) assigned manually once; Ignore Auto-Tag
      # recommended for short label names.
      Studio:
        Name:
          selector: "$meta/dt[normalize-space(.)='シリーズ']/following-sibling::dd[1]//a[1]"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
        URLs:
          selector: "$meta/dt[normalize-space(.)='シリーズ']/following-sibling::dd[1]//a[1]/@href"
          postProcess:
            - javascript: |
                var v = value || "";
                if (!v) return "";
                v = v.replace(/^\/\//, "https://");
                if (/^https?:/i.test(v)) return v;
                if (v.charAt(0) === "/") return "https://www.ko-shop.com" + v;
                return "https://www.ko-shop.com/" + v;
      URLs:
        fixed: "{inputURL}"

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"