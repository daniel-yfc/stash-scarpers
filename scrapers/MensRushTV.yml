# Men's Rush TV — sceneByURL + search scraper
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Search verification: selectors checked against rendered search DOM
#   https://www.mensrush.tv/list.php?keyword=%E9%9B%84%E7%A9%B4
# sceneByURL verified against live detail pages (2026-09-07):
#   - https://www.mensrush.tv/single.php?id=MR-KR2247_DL
#   - https://www.mensrush.tv/single.php?id=GT-2641_DL
#   - https://www.mensrush.tv/single.php?id=ARGA-126_DL
#   - https://www.mensrush.tv/single.php?id=NAO-512_DL (session-only, title only for guests)
#   - https://www.mensrush.tv/single.php?id=RCHS-068_DL (session-only, title only for guests)
#
# Detail pages for NAO/RCHS product codes appear to be session/purchased-only;
# the search index still returns them, but single.php only renders a title.
# 2026-10-06: Performers fixed to a[href^='list.php?mid='] (old selector hit the
# description paragraph); Image covers both player renders (<video poster>
# and <img class="no-save" src>); Date documented as page-dependent.
# Last Updated: 2026-10-10

name: Men's Rush TV

sceneByURL:
  - action: scrapeXPath
    url:
      - mensrush.tv/single.php
      - www.mensrush.tv/single.php
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.mensrush.tv/list.php?keyword={}"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

# Identify disabled: this entry returned a keyword-results page as one scene.
# Use sceneByName and select a result for sceneByQueryFragment instead.
# See docs/metadata-feed-integration.md (2026-10-10).

xPathScrapers:
  searchScraper:
    common:
      $results: //div[contains(@class,'movie_box')][.//a[contains(@href,'single.php')]]

    scene:
      Title:
        selector: $results//p[1]
        postProcess:
          - replace:
              - regex: '^\\s+|\\s+$'
                with: ""

      Code:
        selector: $results//a[contains(@href,'single.php')]/@href
        postProcess:
          - replace:
              - regex: "^.*?[?&]id=([^&]+).*$"
                with: "$1"
              - regex: '\\s+'
                with: ""

      URLs:
        selector: $results//a[contains(@href,'single.php')]/@href
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://www.mensrush.tv" + v;
              return "https://www.mensrush.tv/" + v;

      Image:
        selector: $results//img[1]/@src
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://www.mensrush.tv" + v;
              return v.replace(/_sm\.(webp|jpg)$/, ".$1");

      # Date: omitted for search results. Men's Rush search cards do not expose a
        # real release date on the public list view. A previous version
        # synthesized one from the code's numeric suffix ("20$1-01-01"), which
        # produced invalid or fabricated dates (e.g. suffix 629 -> 20629-01-01,
        # two-digit suffixes -> wrong/future years). Wrong dates are worse than
        # empty for Identify matching, so search results carry no Date. Use the
        # detail page (sceneScraper Date) for a real release date.

  sceneScraper:
    scene:
      Title:
        selector: //div[@class='detail_title'][1]//h2[1]/text() | //title
        postProcess:
          - replace:
              - regex: '^\\s+|\\s+$'
                with: ""
              - regex: "Men''s Rush\\.TV.*$"
                with: ""

      Code:
        selector: //input[@name='fid']/@value
        postProcess:
          - replace:
              - regex: "_DL$"
                with: ""
          - replace:
              - regex: '^\\s+|\\s+$'
                with: ""

      URLs:
        fixed: "{inputURL}"

      # Date: omitted (2026-10-10). Detail pages carry no release-date field
      # at all — verified 9/9 direct-label scenes (MS-629/628/627,
      # GT-2784/2783/2782, MR-KR2408/2407/2406): the info block shows only
      # price, validity period, duration, size, model, maker, genre.
      # The old selector //p[contains(.,'発売') or contains(.,'配信')]
      # risked matching the streaming-validity paragraph and extracting a
      # wrong date. Wrong dates are worse than empty for Identify matching
      # (same precedent as the search-result Date removal above).

      # Studio convention: label/brand-level field → Studio (sub-studio model,
      # StashDB amateur-studios).
      # Studio URLs mapped from the same anchor as Studio Name for Identify URL-matching.
      # Parent studio (platform/network) assigned manually once; Ignore Auto-Tag
      # recommended for short label names.
      Studio:
        Name:
          # A page can list two makers (e.g. ARGA-134_DL) — collect all
          # maid links, not just the first. Verified 2026-10-08.
          selector: //div[@class='movie_detail'][1]//p//a[contains(@href,'list.php?maid=')]/text() | //div[@class='movie_detail'][1]//p//a[contains(@href,'fansme.jp/user/')][1]/text()
          postProcess:
            - replace:
                - regex: "^FansMe（(.+)）$"
                  with: "$1"
            - replace:
                - regex: '^\\s+|\\s+$'
                  with: ""

        URLs:
          # Mirror the Name multi-value behaviour: all maid links + FansMe [1].
          selector: //div[@class='movie_detail'][1]//p//a[contains(@href,'list.php?maid=')]/@href | //div[@class='movie_detail'][1]//p//a[contains(@href,'fansme.jp/user/')][1]/@href
      Performers:
        Name:
          # Live DOM (2026-10-06): performer links are a[href^='list.php?mid=']
          # inside div.movie_detail. The old "p contains モデル" selector also
          # matched the description paragraph mentioning the name (false positive).
          # Label-dependent (2026-10-10): the mid= performer field appears on
          # directly-operated labels (Men's Street 3/3, メンズラッシュ 3/3,
          # GET-film 1/3 sampled) and some third-party labels; even direct
          # labels are not 100% (GET-film GT-2783/GT-2782 lack it).
          # FansMe items (FANS-* codes, maid=156) never have it — they show
          # an external fansme.jp 出品者 link instead (individual creator,
          # e.g. FansMe（YUKI RITO）). Absent field is legitimate,
          # not a selector bug.
          selector: //div[@class='movie_detail'][1]//a[starts-with(@href,'list.php?mid=')]/text()
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""

      Tags:
        Name:
          selector: //div[@class='movie_detail'][1]//p//a[contains(@href,'list.php?geid=')]/text()
          postProcess:
            - replace:
                - regex: '^\\s+|\\s+$'
                  with: ""

      Details:
        # Some pages split the blurb into a short summary p[1] + full text
        # p[2] — take all following paragraphs. Verified 2026-10-08.
        selector: //div[@class='movie_detail']/h3[1]/following-sibling::p//text()[normalize-space()]
        concat: "\n\n"
        postProcess:
          # Strip the trailing file-size disclaimer when present
          # (2026-10-07).
          - replace:
              - regex: "\\s*※ファイルサイズが大きい為、ご利用環境によっては通信量制限に大きく影響します。特にモバイル端末をご利用の場合はご契約プランをご確認の上、Wi-Fi環境にてご利用下さい。\\s*$"
                with: ""

      Image:
        # Live DOM (2026-10-06): player renders EITHER <video poster="...">
        # or <img class="no-save" src="..."> depending on render state —
        # union both. Poster/img URL carries a session query (?s=<digits>),
        # stripped below.
        selector: //video[1]/@poster | //div[@id='movie_area']//div[contains(@class,'player')]//img[1]/@src
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://www.mensrush.tv" + v;
              return "https://www.mensrush.tv/" + v;

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
# Last Updated: 2026-10-10