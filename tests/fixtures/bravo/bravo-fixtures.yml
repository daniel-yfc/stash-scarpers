  - name: "BRAVO clip missing title"
    classification: completed
    html: "clip-missing-title.html"
    locale:
      lang: "ja"
      text: "999"
    mappedExpect:
      - field: Title
        values: []
      - field: Code
        values: ["999"]
      - field: Duration
        values: ["1800"]
      - field: URLs
        routeThrough: sceneByURL
        values: ["https://www.bravo-japan.com/clips/999"]
      - field: Image
        values: []
    expect:
      - xpath: "//h2[normalize-space()='Clip']/preceding::h2[1]"
        min: 1
        max: 1
        values: ["999"]
      - xpath: "//link[@rel='canonical']/@href"
        min: 1
        max: 1
        values: ["https://www.bravo-japan.com/clips/999"]
    optionalField:
      xpath: "//h1"
      expectedCount: 0
  - name: "BRAVO dvd 281"
    classification: completed
    html: "dvd-281.html"
    locale:
      lang: "ja"
      text: "281"
    expect:
      - xpath: "//div[@id='comp-kbfkf16x']//h1[contains(@class,'font_0')] | //meta[@property='og:title']/@content"
        min: 1
        max: 1
        values: ["281"]
      - xpath: "//link[@rel='canonical']/@href"
        min: 1
        max: 1
        values: ["https://www.bravo-japan.com/dvds/281"]
    optionalField:
      xpath: "//div[@id='comp-kbflq5xd']//img/@src | //div[@id='comp-kbflq5xd']//video/@poster"
      expectedCount: 0
  - name: "BRAVO dvd 046"
    classification: completed
