# Wave 1B Clips mapping tests, isolated from the historical manifest.
# Historical bravo-fixtures.yml (DVD + Cloudflare cases, evidence digest
# be1885d2...) is restored byte-for-byte from main and must NOT be edited
# to accommodate these cases; that is why this separate manifest exists.
# Poster URLs and description/keywords in these fixtures are CONTROLLED
# fixture-local values, NOT real website covers or live copy.
# Live Image value: SOURCE_IMAGE_UNVERIFIED, pending Gate B.
scraper: scrapers/BRAVO.yml
cases:
  - name: "BRAVO clip 284"
    classification: completed
    html: "clip-284.html"
    locale:
      lang: "ja"
      text: "284"
    mappedExpect:
      - field: Title
        values: ["デカマラ同士 目隠し交尾"]
      - field: Code
        values: ["284"]
      - field: Duration
        values: ["1800"]
      - field: URLs
        routeThrough: sceneByURL
        values: ["https://www.bravo-japan.com/clips/284"]
      - field: Details
        values: ["フィクスチャ用の説明文です。"]
      - field: Tags.Name
        values: ["テスト,フィクスチャ"]
      - field: Image
        values: ["https://example.invalid/clip-284-poster.jpg"]
    expect:
      - xpath: "//h1"
        min: 1
        max: 1
        values: ["デカマラ同士 目隠し交尾"]
      - xpath: "//h2[normalize-space()='Clip']/preceding::h2[1]"
        min: 1
        max: 1
        values: ["284"]
      - xpath: "//link[@rel='canonical']/@href"
        min: 1
        max: 1
        values: ["https://www.bravo-japan.com/clips/284"]
    optionalField:
      xpath: "//h2[normalize-space()='品番']"
      expectedCount: 0
