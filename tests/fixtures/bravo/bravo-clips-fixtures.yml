# Wave 1B Clips mapping tests, isolated from the historical manifest.
# Historical bravo-fixtures.yml (DVD + Cloudflare cases, evidence digest
# be1885d2...) is restored byte-for-byte from main and must NOT be edited
# to accommodate these cases; that is why this separate manifest exists.
# Poster URLs and description/keywords in these fixtures are CONTROLLED
# fixture-local values, NOT real website covers or live copy.
# Live Image value: SOURCE_IMAGE_UNVERIFIED, pending Gate B.
# CORRECTED 2026-11-03 (Gate B DEF-01/02): description inside
# div[@id='comp-kbfkf17h'] as rich-text spans (with nav/promo rich text
# outside the container). Descriptions are deliberately DIFFERENT per
# clip (284 vs 282 vs 283/285/286) so a cross-page description leak
# fails the test instead of hiding behind an identical placeholder.
# CORRECTED 2026-11-04 (Gate B DEF-01 R2, Gate B v3 L9 evidence): the
# live heading order is spacer h2 (U+200B) after the h1, Code, "Clip",
# minutes, CLEAN 作品TIME label, min. The 2026-11-03 claim of a spacer
# between minutes and the label and a leading U+200B on the label was
# falsified by Gate B v3 and is corrected in the fixtures; both
# reverse-axis Duration selectors pass on this live-shape page offline
# yet returned null live in Stash, so R2 replaces them with a
# forward-axis selector from the Clip label. New R2 cases: price
# heading after Clip (287, must skip to 30), spacer after Clip (288,
# must skip to 30), missing minutes (289, Duration must be empty).
# OMISSION 2026-11-04 (Controller decision WS-2E-DEF01-DEFER-20261104,
# R3 H4): production mappedExpect.Duration assertions are REMOVED for
# every case below. The Stash mapped runtime cannot return a typed int
# for scene Duration, so no production assertion can pass; the source
# minutes-to-seconds expectations are retained in source-only tests
# (tools/tests/test_bravo_clips.py) and in the deferred specification
# (docs/qa/PR93-DURATION-DEFERRED-SPEC.md). Fixture HTMLs are unchanged.
scraper: scrapers/BRAVO.yml
cases:
  - name: "BRAVO clip 284"
    classification: completed
    html: "clip-284.html"
    locale:
      lang: "ja"
      text: "284"
    mappedExpect:
      - field: Title
        values: ["デカマラ同士 目隠し交尾"]
      - field: Code
        values: ["284"]
      - field: URLs
        routeThrough: sceneByURL
        values: ["https://www.bravo-japan.com/clips/284"]
      - field: Details
        values: ["フィクスチャ用 284 の説明文です。"]
      - field: Tags.Name
        values: ["テスト,フィクスチャ"]
      - field: Image
        values: ["https://example.invalid/clip-284-poster.jpg"]
    expect:
      - xpath: "//h1"
        min: 1
        max: 1
        values: ["デカマラ同士 目隠し交尾"]
      - xpath: "//h2[normalize-space()='Clip']/preceding::h2[1]"
        min: 1
        max: 1
        values: ["284"]
      - xpath: "//link[@rel='canonical']/@href"
        min: 1
        max: 1
        values: ["https://www.bravo-japan.com/clips/284"]
      - xpath: "//div[@id='comp-kbfmf948']//h2[1]"
        min: 1
        max: 1
        values: ["30"]
      - xpath: "//div[@id='comp-kbfkf17h']//span[contains(@class,'wixui-rich-text__text')][1]"
        min: 1
        max: 1
        values: ["フィクスチャ用 284 の説明文です。"]
    optionalField:
      xpath: "//h2[normalize-space()='品番']"
      expectedCount: 0
