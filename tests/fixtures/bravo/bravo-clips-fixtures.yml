# Wave 1B Clips mapping tests, isolated from the historical manifest.
# Historical bravo-fixtures.yml (DVD + Cloudflare cases, evidence digest
# be1885d2...) is restored byte-for-byte from main and must NOT be edited
# to accommodate these cases; that is why this separate manifest exists.
# Poster URLs and description/keywords in these fixtures are CONTROLLED
# fixture-local values, NOT real website covers or live copy.
# Live Image value: SOURCE_IMAGE_UNVERIFIED, pending Gate B.
# CORRECTED 2026-11-03 (Gate B DEF-01/02): fixtures are now live-faithful
# for the failure modes: a spacer h2 (U+200B) after the h1, a spacer h2
# between minutes and the 作品TIME label, a leading U+200B on that label,
# and description inside div[@id='comp-kbfkf17h'] as rich-text spans
# (with nav/promo rich text outside the container). The old selectors
# return the spacer / nothing on these pages; the corrected selectors
# return minutes and the container description. Descriptions are
# deliberately DIFFERENT per clip (284 vs 282 vs 283/285/286) so a
# cross-page description leak fails the test instead of hiding behind
# an identical placeholder.
scraper: scrapers/BRAVO.yml
cases:
  - name: "BRAVO clip 284"
    classification: completed
    html: "clip-284.html"
    locale:
      lang: "ja"
      text: "284"
    mappedExpect:
      - field: Title
        values: ["デカマラ同士 目隠し交尾"]
      - field: Code
        values: ["284"]
      - field: Duration
        values: ["1800"]
      - field: URLs
        routeThrough: sceneByURL
        values: ["https://www.bravo-japan.com/clips/284"]
      - field: Details
        values: ["フィクスチャ用 284 の説明文です。"]
      - field: Tags.Name
        values: ["テスト,フィクスチャ"]
      - field: Image
        values: ["https://example.invalid/clip-284-poster.jpg"]
    expect:
      - xpath: "//h1"
        min: 1
        max: 1
        values: ["デカマラ同士 目隠し交尾"]
      - xpath: "//h2[normalize-space()='Clip']/preceding::h2[1]"
        min: 1
        max: 1
        values: ["284"]
      - xpath: "//link[@rel='canonical']/@href"
        min: 1
        max: 1
        values: ["https://www.bravo-japan.com/clips/284"]
      - xpath: "//div[@id='comp-kbfmf948']//h2[1]"
        min: 1
        max: 1
        values: ["30"]
      - xpath: "//div[@id='comp-kbfkf17h']//span[contains(@class,'wixui-rich-text__text')][1]"
        min: 1
        max: 1
        values: ["フィクスチャ用 284 の説明文です。"]
    optionalField:
      xpath: "//h2[normalize-space()='品番']"
      expectedCount: 0
