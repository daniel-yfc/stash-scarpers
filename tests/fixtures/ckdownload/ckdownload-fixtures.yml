scraper: scrapers/CK-Download.yml
cases:
  - name: "CK-Download product 8872"
    classification: completed
    html: "product-8872.html"
    locale:
      text: "ブリーフ大好き親父と援交常習少年"
    mappedExpect:
      - field: Title
        values: ["ブリーフ大好き親父と援交常習少年"]
      - field: Code
        values: ["RJ-00030-MG"]
    expect:
      - xpath: "//table[contains(@class,'prod_data')][1]//th[normalize-space(.)='DVDタイトル']/following-sibling::td[1][normalize-space()]"
        min: 1
        max: 1
        values: ["ブリーフ大好き親父と援交常習少年"]
      - xpath: "//table[contains(@class,'prod_data')][1]//th[normalize-space(.)='プロダクトナンバー']/following-sibling::td[1]"
        min: 1
        max: 1
        values: ["RJ-00030-MG"]
      - xpath: "//div[contains(@class,'add_info')]//div[contains(@class,'date')][1]"
        min: 1
        max: 1
    optionalField:
      xpath: "//table[contains(@class,'prod_data')][1]//th[normalize-space(.)='監督']/following-sibling::td[1]"
      expectedCount: 0
