name: Publish Stash Scraper Source

on:
  pull_request:
    branches: [main]
    paths:
      - "scrapers/*.yml"
      - "tools/build_scraper_source.py"
      - "tools/tests/test_scraper_source.py"
      - "requirements.txt"
      - "validator/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/publish-scraper-source.yml"
  push:
    branches: [main]
    paths:
      - "scrapers/*.yml"
      - "tools/build_scraper_source.py"
      - "tools/tests/test_scraper_source.py"
      - "requirements.txt"
      - "validator/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/publish-scraper-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stash-scraper-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable scraper source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Per-scraper Git revision/date are part of the index contract.

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Check scraper source packaging contracts
        run: python -m pytest tools/tests/test_scraper_source.py -v

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify official scraper schema, URLs and policy
        run: |
          node validator/index.mjs -a --ci
          node validator/index.mjs -a -s --ci
          bash tools/validate-all.sh
          python tools/scan_session_material.py

      - name: Generate index.yml and installable ZIPs
        run: python tools/build_scraper_source.py --output _site/main

      - name: Verify generated ZIP digests
        run: python tools/build_scraper_source.py --output _site/main --verify-only

      - name: Upload source site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy installable source to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy source
        id: deployment
        uses: actions/deploy-pages@v4
