name: Evidence Contract

on:
  push:
    branches: [main]
    paths:
      - "evidence/**"
      - "tests/fixtures/**"
      - "tools/check_evidence_contract.py"
      - "tools/tests/test_evidence_contract.py"
      - ".github/workflows/evidence-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "evidence/**"
      - "tests/fixtures/**"
      - "tools/check_evidence_contract.py"
      - "tools/tests/test_evidence_contract.py"
      - ".github/workflows/evidence-contract.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tools/tests/test_evidence_contract.py -v
      - run: python tools/check_evidence_contract.py
