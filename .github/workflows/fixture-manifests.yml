name: Fixture Manifest Verification

on:
  push:
    branches: [main]
    paths:
      - "tests/fixtures/**"
      - "tools/run_fixture_manifests.py"
      - "tools/verify-scraper-fixtures.mjs"
      - "tools/tests/test_fixture_manifest_discovery.py"
      - ".github/workflows/fixture-manifests.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/fixtures/**"
      - "tools/run_fixture_manifests.py"
      - "tools/verify-scraper-fixtures.mjs"
      - "tools/tests/test_fixture_manifest_discovery.py"
      - ".github/workflows/fixture-manifests.yml"

permissions:
  contents: read

jobs:
  fixture-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tools/tests/test_fixture_manifest_discovery.py -v
      - run: python tools/run_fixture_manifests.py
