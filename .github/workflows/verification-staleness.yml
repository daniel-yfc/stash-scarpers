name: Verification Staleness

# Staleness is time-driven, not code-driven — primary trigger is the weekly cron.
# Push trigger exists as an early warning only.

on:
  schedule:
    - cron: "0 0 * * 1" # Weekly, Monday 00:00 UTC
  push:
    branches: [main]
    paths:
      - "scrapers/**/*.yml"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  staleness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run staleness check
        id: check
        continue-on-error: true
        run: python tools/livetest.py > staleness-report.txt 2>&1; cat staleness-report.txt

      - name: Report to Step Summary
        if: always()
        run: |
          echo '## Verification Staleness Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat staleness-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Open issue on scheduled STALE detection
        if: github.event_name == 'schedule' && steps.check.outcome == 'failure'
        run: |
          gh issue create \
            --title "STALE verification metadata detected ($(date +%Y-%m-%d))" \
            --body "Weekly staleness check found scrapers past their TTL. See workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} for the full report." \
            --label "verification" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
