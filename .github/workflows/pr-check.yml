name: Changed Scraper PR Check

on:
  pull_request:
    paths:
      - "scrapers/**/*.yml"
      - "validator/**"
      - "tools/**"
      - "skills/stash-scraper-builder/**"
      - "requirements.txt"
      - ".github/workflows/pr-check.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install documentation-check dependencies
        run: python -m pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Check documentation examples and contradictions
        run: python tools/check_scraper_docs.py

      - name: Get changed scraper files
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          files: |
            scrapers/**/*.yml

      - name: Validate changed scrapers
        if: steps.changed.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        shell: bash
        run: |
          set -uo pipefail
          {
            echo '## Changed Scraper PR Check'
            echo
            echo '| File | Result |'
            echo '| --- | --- |'
          } > results.md
          failed=0
          read -r -a changed <<< "$CHANGED_FILES"
          for scraper in "${changed[@]}"; do
            if [[ ! "$scraper" =~ ^scrapers/(private/)?[A-Za-z0-9_-]+\.yml$ ]]; then
              echo '| Invalid scraper path | FAIL — inspect changed filename |' >> results.md
              failed=1
              continue
            fi
            if [[ ! -f "$scraper" ]]; then
              echo "| \`$scraper\` | Deleted or absent — no file to check |" >> results.md
              continue
            fi
            if bash tools/scraper-quality-gate.sh "$scraper"; then
              echo "| \`$scraper\` | PASS |" >> results.md
            else
              echo "| \`$scraper\` | FAIL — see job log |" >> results.md
              failed=1
            fi
          done
          exit "$failed"

      - name: Comment results on PR
        if: always() && steps.changed.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('results.md')) return;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- scraper-pr-check -->';
            const body = marker + '\n' + fs.readFileSync('results.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
