name: Live CDP Evidence Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "evidence/**"
      - "tools/check_live_cdp_status.py"
      - ".github/workflows/cdp-evidence-gate.yml"

permissions:
  contents: read

jobs:
  cdp-evidence:
    name: Fail closed on CDP claims
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record runtime boundary and reject overclaims
        run: |
          python - <<'PY'
          import shutil
          print("Stash binary:", "present" if shutil.which("stash") else "absent")
          print("This runner does not perform live CDP extraction.")
          PY
          python tools/check_live_cdp_status.py
