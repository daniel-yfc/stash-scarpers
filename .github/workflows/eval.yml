name: Manual Python Regression Tests

# Runs repository pytest tests, not the five-task scraper skill evaluation pack.
on:
  workflow_dispatch:
    inputs:
      test_file:
        description: "Optional test_*.py filename under tools/tests/; blank runs the whole suite"
        required: false
        type: string

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run selected repository tests
        env:
          TEST_FILE: ${{ inputs.test_file }}
        shell: bash
        run: |
          set -euo pipefail
          target=tools/tests/
          if [[ -n "$TEST_FILE" ]]; then
            if [[ ! "$TEST_FILE" =~ ^test_[A-Za-z0-9_]+\.py$ ]]; then
              echo 'Expected a basename matching test_*.py' >&2
              exit 2
            fi
            target="tools/tests/$TEST_FILE"
            if [[ ! -f "$target" ]]; then
              echo 'Selected test file does not exist' >&2
              exit 2
            fi
          fi
          python -m pytest "$target" -v
