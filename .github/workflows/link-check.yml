name: Advisory Documentation Links

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly, Sunday 00:00 UTC
  workflow_dispatch:
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check repository Markdown links (advisory)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml ./**/*.md
          output: lychee/out.md
          fail: false

      - name: Upload lychee results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-results
          path: lychee/out.md
