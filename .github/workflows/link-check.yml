name: Advisory Documentation Links

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly, Sunday 00:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - ".github/workflows/link-check.yml"

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check repository Markdown links (advisory)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--verbose --no-progress './**/*.md' './.github/**/*.md'"
          fail: false
          failIfEmpty: true

      - name: Upload link report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lychee-results
          path: lychee/out.md
          if-no-files-found: ignore
