name: Single Scraper Policy Check

# Manual diagnostic only; not the five-task Eval Pack or full validation.
on:
  workflow_dispatch:
    inputs:
      scraper_file:
        description: "Optional scraper basename, e.g. ACCEED.yml"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check selected scraper policy
        env:
          SCRAPER_FILE: ${{ inputs.scraper_file }}
        shell: bash
        run: |
          set -euo pipefail
          file="${SCRAPER_FILE:-ACCEED.yml}"
          if [[ ! "$file" =~ ^[A-Za-z0-9_-]+\.yml$ ]]; then
            echo 'Expected a scraper filename, without a directory' >&2
            exit 2
          fi
          target="scrapers/$file"
          if [[ ! -f "$target" ]]; then
            echo 'Selected scraper does not exist' >&2
            exit 2
          fi
          bash tools/scraper-quality-gate.sh "$target"
