name: Live Raw-Response Scrutiny

# HTTP + JSDOM checks; not rendered-DOM or live Stash/CDP verification.
on:
  workflow_dispatch:
    inputs:
      scraper:
        description: "Scraper path or filename; blank tests all"
        required: false
        default: ""
      search:
        description: "Test searchScraper query and multi-result parsing"
        type: boolean
        default: true
      paginate:
        description: "Walk search pagination pages 1-3"
        type: boolean
        default: false
      url:
        description: "Explicit HTTPS detail scene URL"
        required: false
        default: ""
      probe:
        description: "Custom probe keyword(s), comma-separated"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scrutiny:
    name: Raw HTTP and JSDOM Scrutiny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run raw-response scrutiny
        env:
          SCRAPER_INPUT: ${{ inputs.scraper }}
          SEARCH_INPUT: ${{ inputs.search }}
          PAGINATE_INPUT: ${{ inputs.paginate }}
          DETAIL_URL: ${{ inputs.url }}
          PROBE_INPUT: ${{ inputs.probe }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          [[ "$SEARCH_INPUT" == true ]] && args+=(--search)
          [[ "$PAGINATE_INPUT" == true ]] && args+=(--paginate --multi)
          if [[ -n "$DETAIL_URL" ]]; then
            if [[ "$DETAIL_URL" != https://* ]]; then
              echo 'Explicit detail URL must be HTTPS' >&2
              exit 2
            fi
            args+=("--url=$DETAIL_URL")
          fi
          [[ -z "$PROBE_INPUT" ]] || args+=("--probe=$PROBE_INPUT")
          if [[ -z "$SCRAPER_INPUT" ]]; then
            node tools/scrutiny.js --all "${args[@]}"
          else
            target="$SCRAPER_INPUT"
            [[ "$target" == scrapers/* ]] || target="scrapers/$target"
            if [[ ! "$target" =~ ^scrapers/[A-Za-z0-9_-]+\.yml$ || ! -f "$target" ]]; then
              echo 'Select an existing public scraper YAML file' >&2
              exit 2
            fi
            node tools/scrutiny.js "$target" "${args[@]}"
          fi
